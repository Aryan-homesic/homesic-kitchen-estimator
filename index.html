<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="theme-color" content="#121110">
<title>Homesic · Modular kitchen price</title>
<meta name="description" content="Price your modular kitchen in a few minutes. Real rates, free site visit, 10-year service warranty.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231C1B19'/%3E%3Cpath d='M8 24V14l8-6 8 6v10' fill='none' stroke='%23F3F0EA' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121110; --white:#1B1A18; --frame:#ECE7DF; --grid:rgba(255,255,255,.028);
  --ink:#F1ECE4; --ink2:#CFC8BC; --muted:#958D80;
  --line:#2B2926; --line2:#3D3A35;
  --accent:#C98A5B; --accent-d:#DDA67C; --accent-bg:rgba(201,138,91,.15);
  --ok:#86B596; --warn:#E3906F;
  --r:6px;
  --display:Jost,"Futura","Avenir Next",ui-sans-serif,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
h1,h2{margin:0;font-family:var(--display);font-weight:500;letter-spacing:-.6px;line-height:1.08}
h1{font-size:clamp(26px,3.4vw,42px)}
h2{font-size:22px;letter-spacing:-.2px}
h1:focus{outline:none}
p{margin:0}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:2.2px;text-transform:uppercase;font-weight:500;color:var(--accent);margin-bottom:8px}
.hint{font-size:13px;color:var(--muted)}

/* ---------- shell ---------- */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.top{flex:none;border-bottom:1px solid var(--line);background:rgba(18,17,16,.82);transition:background .5s,border-color .5s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top)}
.top .in{max-width:1180px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-right:auto}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:3px}
.brand small{display:block;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-top:-2px}

/* ---------- floating step dock ---------- */
.dock{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;transition:opacity .4s,transform .5s var(--ease)}
body.start .dock,.dock.gone{opacity:0;transform:translate(-50%,24px);pointer-events:none}
.dock-bar{display:flex;align-items:center;gap:4px;padding:6px 16px 6px 6px;background:rgba(32,30,28,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid rgba(255,255,255,.1);border-radius:999px;box-shadow:0 24px 48px -18px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06)}
.dock-btn{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--ink);display:grid;place-items:center;font-size:16px;transition:background .2s,opacity .2s}
.dock-btn:hover:not(:disabled){background:rgba(255,255,255,.16)}
.dock-btn:disabled{opacity:.3;cursor:default}
.dock-cur{display:flex;flex-direction:column;align-items:flex-start;gap:5px;border:0;background:none;padding:4px 12px;font-family:var(--display);font-size:14px;color:var(--ink);line-height:1}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);transition:width .3s var(--ease),background .3s}
.dots i.done{background:var(--accent)}
.dots i.cur{width:18px;background:var(--ink)}
.dock-sep{width:1px;height:28px;background:rgba(255,255,255,.12);margin:0 6px}
.est{line-height:1.1}
.est span{display:block;font-family:var(--display);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.est b{font-family:var(--display);font-weight:500;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.est.bump b{animation:bump .5s var(--ease)}
@keyframes bump{40%{color:var(--accent);transform:translateY(-1px)}}
.dock-menu{position:absolute;left:50%;bottom:calc(100% + 12px);width:300px;padding:8px;transform:translate(-50%,10px) scale(.97);transform-origin:50% 100%;
  background:rgba(32,30,28,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);border-radius:18px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.9);opacity:0;pointer-events:none;transition:opacity .2s,transform .3s var(--ease);
  max-height:min(78vh,700px);overflow-y:auto;overscroll-behavior:contain}
.dock-menu::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px}
.dock.open .dock-menu{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
@media (hover:hover){ .dock:hover .dock-menu{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)} }
.dock-menu button{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;width:100%;padding:7px 10px;border:0;border-radius:11px;background:none;color:var(--ink2);text-align:left;font-size:14px;transition:background .15s}
.dock-menu button:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.dock-menu button.cur{background:var(--accent-bg);color:var(--ink)}
.dock-menu .n{font-family:var(--display);font-size:11px;letter-spacing:1px;color:var(--muted)}
.dock-menu button.done .n{color:var(--accent)}
.dock-menu em{font-style:normal;font-size:12.5px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:500;font-size:14px;transition:background .15s,border-color .15s,opacity .2s;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent)}
.btn:disabled{background:transparent;color:var(--muted);border-color:var(--line2);cursor:not-allowed}
.btn.lg{padding:16px 30px;font-size:15px}
.btn.line{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.line:hover{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,.dock button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- stage + transitions ---------- */
#stage{flex:1;min-height:0;width:100%;max-width:1180px;margin:0 auto;padding:28px 24px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;
  transition:opacity .26s ease,transform .32s var(--ease),filter .26s ease}
body:not(.start) #stage{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
#stage.out{opacity:0;transform:translateY(calc(var(--d,1) * -16px)) scale(.985);filter:blur(6px)}
#stage.in{opacity:0;transform:translateY(calc(var(--d,1) * 22px));filter:blur(4px);transition:none}
.head{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.head-copy{min-width:0}
.head .hint{margin-top:6px}
.head-action{flex:none;display:flex;gap:8px;margin-top:2px}
.head-action .btn{padding:11px 18px}

/* subtle board comparison, closed by default */
.compare{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:rgba(18,17,16,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden}
.compare summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  font-family:var(--display);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.compare summary::-webkit-details-marker{display:none}
.compare summary::after{content:'+';font-size:14px;color:var(--muted)}
.compare[open] summary::after{content:'–'}
.compare .cmp{padding:0 14px 12px}
.compare table{width:100%;border-collapse:collapse;font-size:12px}
.compare th,.compare td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);color:var(--ink2);font-weight:400}
.compare thead th{color:var(--muted);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase}
.compare tbody th{width:31%;color:var(--muted);font-weight:500}
.compare tbody tr:last-child td{color:var(--accent-d)}
#stage:has(.compare[open]){overflow-y:auto;padding-bottom:calc(96px + env(safe-area-inset-bottom))}

/* ---------- option grid ---------- */
.grid{flex:0 1 auto;min-height:0;display:grid;gap:14px;grid-template-columns:repeat(var(--c),minmax(0,1fr));grid-auto-rows:minmax(0,var(--rh))}
.after{flex:none;display:flex;justify-content:flex-end;margin-top:18px;animation:rise .45s var(--ease) both}
.opt{position:relative;display:flex;flex-direction:column;min-height:0;padding:0;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  transition:border-color .2s,box-shadow .2s,opacity .3s,transform .3s var(--ease);animation:rise .45s var(--ease) both;animation-delay:calc(var(--i) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.opt:hover{border-color:var(--line2);box-shadow:0 18px 40px -24px rgba(0,0,0,.8)}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.grid.picked .opt:not(.on){opacity:.25;transform:scale(.97)}
.ph{position:relative;flex:1;min-height:0;margin:6px 6px 0;border-radius:4px;background:var(--frame);overflow:hidden;isolation:isolate}
.ph img{width:100%;height:100%;object-fit:cover;object-position:var(--o,center);transform:scale(var(--z,1));transform-origin:var(--o,center);
  mix-blend-mode:multiply;filter:saturate(.88) contrast(1.03);transition:transform .7s var(--ease)}
.ph img.fit{object-fit:contain;padding:6%;transform:none}
.opt:hover .ph img{transform:scale(calc(var(--z,1) * 1.05))}
.opt:hover .ph img.fit{transform:scale(1.04)}
.ph > svg{width:100%;height:100%;padding:8% 12%}
.meta{flex:none;padding:11px 14px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.nm{font-family:var(--display);font-size:17px;font-weight:500;display:flex;align-items:center;gap:8px;line-height:1.2}
.nm em{font-style:normal;font-family:var(--display);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;background:var(--accent-bg);color:var(--accent-d);padding:2px 6px;border-radius:2px;white-space:nowrap}
.ds{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-size:13px;font-weight:600;color:var(--accent-d);font-variant-numeric:tabular-nums}
.tick{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(18,17,16,.55);border:1px solid rgba(255,255,255,.35);color:transparent;font-size:12px;font-weight:700}
.opt.on .tick{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.opt-hit{position:relative;display:flex;flex-direction:column;flex:1;min-height:0;width:100%;padding:0;border:0;background:none;color:inherit;text-align:left;font:inherit;cursor:pointer;overflow:hidden}
.opt-hit:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.qtybar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.qlabel{font-family:var(--display);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.qty button{width:30px;height:28px;border:0;background:rgba(255,255,255,.06);color:var(--ink);font-size:15px;line-height:1}
.qty button:hover{background:var(--accent-bg)}
.qty span{min-width:26px;text-align:center;font-size:13px;font-weight:600}

/* extra detail on hover / keyboard focus */
.detail{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;gap:3px;padding:12px 14px;
  background:linear-gradient(180deg,rgba(18,17,16,.93),rgba(18,17,16,.99));border-top:1px solid var(--accent);
  transform:translateY(102%);transition:transform .28s var(--ease);pointer-events:none}
.opt:hover .detail,.opt:focus-visible .detail{transform:translateY(0)}
.detail b{font-family:var(--display);font-size:14px;font-weight:500;color:var(--ink)}
.detail span{font-size:12px;line-height:1.35;color:var(--ink2)}
.detail span:first-of-type{color:var(--accent-d);font-weight:500}
.ph-none{display:grid;place-items:center;width:100%;height:100%;min-height:120px;padding:12px;
  color:var(--muted);font-family:var(--display);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;
  border:1px dashed var(--line2);border-radius:4px}
@media (hover:none){ .detail{display:none} }

/* ---------- start ---------- */
.hero{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;max-width:560px}
.hero h1{font-size:clamp(38px,5.4vw,72px);letter-spacing:-1.6px;line-height:1}
.hero .lead{color:var(--ink2);font-size:16.5px;margin-top:16px;max-width:440px}
.hero .hint{color:var(--ink2)}
.from{margin:28px 0;padding:16px 0;border-top:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.18)}
.hero > *{animation:rise .8s var(--ease) both}
.hero > :nth-child(2){animation-delay:.08s}.hero > :nth-child(3){animation-delay:.16s}.hero > :nth-child(4){animation-delay:.24s}.hero > :nth-child(5){animation-delay:.32s}.hero > :nth-child(6){animation-delay:.4s}
.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;opacity:1;transition:opacity .7s ease;pointer-events:none}
body.light .backdrop{opacity:0}
.backdrop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 50%;filter:brightness(.8);animation:kb 22s ease-out both}
@keyframes kb{from{transform:scale(1.08)}}
.backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,11,10,.96) 0%,rgba(12,11,10,.82) 32%,rgba(12,11,10,.25) 62%,rgba(12,11,10,.1) 100%),linear-gradient(180deg,rgba(12,11,10,.55),transparent 18%)}
/* quiz, size and quote pages sit on the same cover photo; a scrim keeps the type readable */
body:not(.start) .backdrop::after{
  background:linear-gradient(180deg,rgba(12,11,10,.80) 0%,rgba(12,11,10,.52) 36%,rgba(12,11,10,.62) 70%,rgba(12,11,10,.9) 100%);
}
body.start .top{background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.app{position:relative;z-index:1}
.from b{display:block;font-family:var(--display);font-weight:500;font-size:clamp(30px,3.4vw,42px);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.trust{display:flex;flex-wrap:wrap;gap:6px 18px;margin:18px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink2)}
.trust li::before{content:"✓";color:var(--ok);margin-right:6px;font-weight:700}

/* ---------- size ---------- */
.field label{display:block;font-family:var(--display);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;padding:14px;border:1px solid var(--line2);border-radius:4px;background:var(--white);font-family:var(--display);font-size:24px;min-width:0}
.field input:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
.field input::placeholder{color:#5E5850}
.field .err{color:var(--warn);font-size:12px;margin-top:4px}
.field .err:empty{display:none}
.sizewrap{width:100%;max-width:560px;margin:auto}
.sizecard{width:100%;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:4px 24px 22px;animation:rise .45s var(--ease) both}
.presets{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.presets .hint{margin-right:4px}
.presets button{border:1px solid var(--line2);background:transparent;color:var(--ink2);border-radius:999px;padding:7px 14px;font-size:13px;font-variant-numeric:tabular-nums;transition:all .15s}
.presets button:hover,.presets button.on{border-color:var(--accent);background:var(--accent-bg);color:var(--ink)}
.dim{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.dim label{font-family:var(--display);font-size:18px;font-weight:500}
.stepper{display:flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:999px;padding:4px;transition:border-color .15s}
.stepper:focus-within{border-color:var(--accent)}
.stepper button{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:rgba(255,255,255,.06);color:var(--ink);font-size:20px;line-height:1}
.stepper button:hover{background:var(--accent-bg)}
.stepper input{width:58px;border:0;background:transparent;text-align:right;font-family:var(--display);font-size:22px;color:var(--ink);padding:0;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none}
.stepper input::placeholder{color:#5E5850}
.stepper span{color:var(--muted);font-size:13px;margin:0 8px 0 5px}
.sizefoot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:18px;flex-wrap:wrap}
#rRun{font-variant-numeric:tabular-nums;color:var(--ink2)}

/* ---------- light pages: details gate + quotation ---------- */
body{transition:background-color .6s ease}
body.light{--bg:#EFEAE2;--white:#fff;--ink:#1C1B19;--ink2:#47433D;--muted:#7A746B;--line:#E2DCD1;--line2:#CDC4B5;--grid:rgba(28,27,25,.045);
  --accent:#A4643A;--accent-d:#874F2B;--accent-bg:#F2E6DA;--ok:#3D6A4E}
body.light .top{background:rgba(239,234,226,.85)}
.brand svg rect{fill:var(--ink);transition:fill .6s}.brand svg path{stroke:var(--bg);transition:stroke .6s}
.gate{position:relative;margin:auto;width:100%;max-width:470px;background:#1C1B19;color:#F1ECE4;border-radius:16px;padding:36px 34px 28px;
  box-shadow:0 50px 90px -40px rgba(28,27,25,.75);animation:pop .6s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.gate .ready{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#9FD0AE;background:rgba(134,181,150,.12);border-radius:999px;padding:6px 12px 6px 6px;margin-bottom:18px}
.gate .ready i{font-style:normal;width:20px;height:20px;border-radius:50%;background:#86B596;color:#1C1B19;display:grid;place-items:center;font-size:11px;font-weight:700}
.gate h1{color:#fff;font-size:clamp(28px,3vw,36px)}
.gate .sub{color:#A9A194;margin:10px 0 24px;font-size:14px}
.gate form{display:flex;flex-direction:column;gap:14px}
.gate .field label{color:#CFC8BC}
.gate .field input{background:#262421;border-color:#3D3A35;color:#F1ECE4;font-family:Inter,sans-serif;font-size:16px;padding:14px}
.gate .field input:focus{border-color:#C98A5B;outline:2px solid rgba(201,138,91,.2)}
.gate .btn{width:100%;margin-top:6px;background:#F1ECE4;border-color:#F1ECE4;color:#1C1B19}
.gate .btn:hover{background:#C98A5B;border-color:#C98A5B}
.gate .err{color:#E3906F}
.gate .fine{margin-top:14px;text-align:center;font-size:12.5px;color:#958D80}
.gate-back{position:absolute;top:14px;right:18px;color:#A9A194;text-decoration:none}
.gate .opt-badge{margin-left:6px;font-family:var(--display);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#A9A194;border:1px solid #3D3A35;border-radius:999px;padding:2px 7px;vertical-align:1px}
.upload{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;font-size:14px;
  background:#262421;border:1px dashed #4A453E;border-radius:6px;color:#CFC8BC;transition:border-color .15s,background .15s}
.upload:hover{border-color:var(--accent);background:#2B2826}

/* ============================================================
   CALCULATOR
   ============================================================ */
const ROOM = { l:10, b:8, h:9 };
const dimsOf = (s = state) => ({ l:Number(s.l) || 0, b:Number(s.b) || 0, h:Number(s.h) || 0 });
const hasSize = (s = state) => dimsOf(s).l > 0 && dimsOf(s).b > 0;
const unitsOf = (s = state) => s.units || DEFAULTS.units;

function runFor(layoutId, s = state){
  const d = hasSize(s) ? dimsOf(s) : { l:ROOM.l, b:ROOM.b, h:Number(s.h) || ROOM.h };
  const layout = byId(LAYOUTS, layoutId) || byId(LAYOUTS, 'lshape');
  const u = unitsOf(s);
  const gross = Math.max(0, layout.gross(d.l, d.b));
  let base = Math.max(0, layout.base(d.l, d.b));
  let wall = Math.max(0, layout.wall(d.l, d.b));
  let grossBase = gross;
  if(u.fridge){
    base = Math.max(0, base - FRIDGE_GAP);
    wall = Math.max(0, wall - FRIDGE_GAP);
    grossBase = Math.max(0, grossBase - FRIDGE_GAP);
  }
  return { gross, base, wall, loft: Math.max(0, layout.wall(d.l, d.b)), grossBase, height:d.h, fridge:!!u.fridge };
}
function runInfo(s = state){ return runFor(s.layout || 'lshape', s); }

function price(s = state){
  const pick = k => s[k] || DEFAULTS[k];
  const info = runInfo(s);
  const u = unitsOf(s);
  const baseOn = !!u.base, wallOn = !!u.wall, loftOn = !!u.loft, tallOn = !!u.tall;
  const board   = byId(BOARDS, pick('board')) || byId(BOARDS, DEFAULTS.board);
  const finish  = byId(FINISHES, pick('finish')) || byId(FINISHES, DEFAULTS.finish);
  const handle  = byId(HANDLES, pick('handle')) || byId(HANDLES, DEFAULTS.handle);
  const counter = byId(COUNTERS, pick('counter')) || byId(COUNTERS, DEFAULTS.counter);
  const splash  = byId(BACKSPLASH, pick('backsplash')) || byId(BACKSPLASH, DEFAULTS.backsplash);
  const sinkMat = byId(SINK_MATERIALS, pick('sinkMaterial')) || byId(SINK_MATERIALS, DEFAULTS.sinkMaterial);
  const sinkT   = byId(SINK_TYPES, pick('sinkType')) || byId(SINK_TYPES, DEFAULTS.sinkType);
  const faucet  = byId(FAUCETS, pick('faucet')) || byId(FAUCETS, DEFAULTS.faucet);
  const hBrand  = byId(HINGE_BRANDS, pick('hingeBrand')) || byId(HINGE_BRANDS, DEFAULTS.hingeBrand);
  const hFn     = byId(HINGE_FUNCTIONS, pick('hingeFunction')) || byId(HINGE_FUNCTIONS, DEFAULTS.hingeFunction);
  const light   = byId(LIGHTING, pick('lighting')) || byId(LIGHTING, DEFAULTS.lighting);

  const loftH = Math.max(0, info.height - LOFT_OFFSET);
  const carcass = {
    base: baseOn ? info.base * 3 : 0,
    wall: wallOn ? info.wall * 2 : 0,
    loft: loftOn ? info.loft * loftH : 0,
    tall: tallOn ? TALL_CARCASS : 0
  };
  carcass.total = carcass.base + carcass.wall + carcass.loft + carcass.tall;

  const doors = {
    base: baseOn ? Math.ceil(info.base / DOOR_WIDTH) : 0,
    wall: wallOn ? Math.ceil(info.wall / DOOR_WIDTH) : 0,
    loft: loftOn ? Math.ceil(info.loft / DOOR_WIDTH) : 0,
    tall: 0
  };
  doors.total = doors.base + doors.wall + doors.loft + doors.tall;
  const handles = doors.total;
  const hinges = handles * 2;

  const skip = s.skip || {};
  const CP  = Math.round(carcass.total * RATES.board[board.id]);
  const FP  = Math.round(carcass.total * RATES.finish[finish.id]);
  const HP  = Math.round(handles * RATES.handle[handle.id]);
  const CTP = (baseOn && !skip.counter) ? Math.round(info.base * COUNTER_DEPTH * RATES.counter[counter.id]) : 0;
  const BSP = skip.backsplash ? 0 : Math.round(info.grossBase * SPLASH_HEIGHT * RATES.backsplash[splash.id]);
  const sinkRate = RATES.sinkMaterial[sinkMat.id] * RATES.sinkType[sinkT.id];
  const sinkAmt = skip.sink ? 0 : sinkRate;
  const faucetAmt = skip.faucet ? 0 : RATES.faucet[faucet.id] * FAUCET_COUNT;
  const SP  = Math.round(sinkAmt + faucetAmt);
  const HiP = Math.round(hinges * RATES.hinge[hBrand.id][hFn.id]);
  const LP  = skip.lighting ? 0 : Math.round(info.grossBase * RATES.lighting[light.id]);
  const acc = s.acc || {};
  let AP = 0;
  const accItems = [];
  ACCESSORIES.forEach(a => {
    const q = Math.max(0, Math.round(Number(acc[a.id]) || 0));
    if(q > 0){
      const amount = q * RATES.accessory[a.id];
      AP += amount;
      accItems.push({ a, q, amount });
    }
  });
  AP = Math.round(AP);

  const construction = CP + FP + HP + CTP + BSP + SP + HiP + LP + AP;
  const design = Math.round(construction * DESIGN_PCT);
  const total = construction + design;

  const lines = [];
  const add = (d, q, u, r, a) => { if(a > 0) lines.push({ d, q: round1(q), u, r: Math.round(r), a }); };
  add('18 mm ' + board.name + ' carcass', carcass.total, 'sq ft', RATES.board[board.id], CP);
  add(finish.name + ' finishing', carcass.total, 'sq ft', RATES.finish[finish.id], FP);
  add(handle.name + ' handles', handles, 'nos', RATES.handle[handle.id], HP);
  if(!skip.counter) add(counter.name + ' countertop', info.base * COUNTER_DEPTH, 'sq ft', RATES.counter[counter.id], CTP);
  if(!skip.backsplash) add(splash.name + ' backsplash', info.grossBase * SPLASH_HEIGHT, 'sq ft', RATES.backsplash[splash.id], BSP);
  if(!skip.sink) add('Sink · ' + sinkMat.name + ' · ' + sinkT.name, 1, 'set', sinkRate, Math.round(sinkRate));
  if(!skip.faucet) add(faucet.name, FAUCET_COUNT, 'nos', RATES.faucet[faucet.id], Math.round(RATES.faucet[faucet.id] * FAUCET_COUNT));
  add('Hinges · ' + hBrand.name + ' ' + hFn.name, hinges, 'nos', RATES.hinge[hBrand.id][hFn.id], HiP);
  if(!skip.lighting) add(light.name + ' lighting', info.grossBase, 'rft', RATES.lighting[light.id], LP);
  accItems.forEach(({ a, q, amount }) => add(a.name, q, 'nos', RATES.accessory[a.id], amount));
  add('Design charge (' + Math.round(DESIGN_PCT * 100) + '%)', 1, '', design, design);

  return {
    run: info, carcass, doors, handles, hinges,
    board, finish, handle, counter, splash, sinkMat, sinkT, faucet, hBrand, hFn, light,
    lines, construction, design, total,
    breakdown: { CP, FP, HP, CTP, BSP, SP, HiP, LP, AP },
    assumed: !hasSize(s)
  };
}

/* ============================================================
   LABELS + HOVER DETAIL
   ============================================================ */
function unitPrice(id, s = state){
  const p = price(s);
  if(id === 'fridge'){
    const off = JSON.parse(JSON.stringify(s)); off.units = { ...unitsOf(s), fridge:false };
    const on = JSON.parse(JSON.stringify(s)); on.units = { ...unitsOf(s), fridge:true };
    return (price(on).construction - price(off).construction) * (1 + DESIGN_PCT);
  }
  const mat = RATES.board[p.board.id] + RATES.finish[p.finish.id];
  const door = RATES.handle[p.handle.id] + 2 * RATES.hinge[p.hBrand.id][p.hFn.id];
  let area = 0, doors = 0;
  if(id === 'base'){ area = p.run.base * 3; doors = Math.ceil(p.run.base / DOOR_WIDTH); }
  if(id === 'wall'){ area = p.run.wall * 2; doors = Math.ceil(p.run.wall / DOOR_WIDTH); }
  if(id === 'loft'){ area = p.run.loft * Math.max(0, p.run.height - LOFT_OFFSET); doors = Math.ceil(p.run.loft / DOOR_WIDTH); }
  if(id === 'tall'){ area = TALL_CARCASS; doors = 0; }
  return (area * mat + doors * door) * (1 + DESIGN_PCT);
}
function optLabel(step, o){
  const p = price();
  const brand = byId(HINGE_BRANDS, state.hingeBrand || DEFAULTS.hingeBrand);
  const fn = byId(HINGE_FUNCTIONS, state.hingeFunction || DEFAULTS.hingeFunction);
  switch(step.id){
    case 'layout': {
      const r = runFor(o.id);
      return '≈ ' + round1(r.base) + ' ft base · ' + round1(r.wall) + ' ft wall';
    }
    case 'units': {
      const r = p.run, up = unitPrice(o.id);
      if(o.id === 'fridge') return up < 0 ? 'Saves ' + inr(-up) : 'No saving';
      if(o.id === 'base') return '≈ ' + inr(up) + ' · ' + round1(r.base) + ' ft run';
      if(o.id === 'wall') return '≈ ' + inr(up) + ' · ' + round1(r.wall) + ' ft run';
      if(o.id === 'loft') return '≈ ' + inr(up) + ' · ' + round1(r.loft) + ' ft run';
      return '≈ ' + inr(up) + ' · 4 sq ft';
    }
    case 'board': return inr(RATES.board[o.id]) + ' / sq ft';
    case 'finish': return inr(RATES.finish[o.id]) + ' / sq ft';
    case 'handle': return inr(RATES.handle[o.id]) + ' each';
    case 'counter': return inr(RATES.counter[o.id]) + ' / sq ft';
    case 'backsplash': return inr(RATES.backsplash[o.id]) + ' / sq ft';
    case 'sinkMaterial': return inr(RATES.sinkMaterial[o.id]) + ' / sink';
    case 'sinkType': return '× ' + RATES.sinkType[o.id];
    case 'faucet': return inr(RATES.faucet[o.id]);
    case 'hingeBrand': return inr(RATES.hinge[o.id][fn.id]) + ' / hinge';
    case 'hingeFunction': return inr(RATES.hinge[brand.id][o.id]) + ' / hinge';
    case 'lighting': return inr(RATES.lighting[o.id]) + ' / ft';
    case 'accessories': return inr(RATES.accessory[o.id]) + ' each';
  }
  return '';
}
function detailLines(step, o){
  const p = price(), r = p.run;
  const brand = byId(HINGE_BRANDS, state.hingeBrand || DEFAULTS.hingeBrand);
  const fn = byId(HINGE_FUNCTIONS, state.hingeFunction || DEFAULTS.hingeFunction);
  switch(step.id){
    case 'layout': {
      const rr = runFor(o.id);
      return ['Gross ' + round1(rr.gross) + ' ft · base ' + round1(rr.base) + ' ft', 'Wall / loft ' + round1(rr.wall) + ' ft' + (rr.fridge ? ' · fridge gap applied' : '')];
    }
    case 'units': {
      const up = unitPrice(o.id);
      if(o.id === 'base') return ['≈ ' + inr(up) + ' incl. design', 'Base run ' + round1(r.base) + ' ft · carcass ' + round1(p.carcass.base) + ' sq ft', p.doors.base + ' doors · countertop separate'];
      if(o.id === 'wall') return ['≈ ' + inr(up) + ' incl. design', 'Wall run ' + round1(r.wall) + ' ft · carcass ' + round1(p.carcass.wall) + ' sq ft', p.doors.wall + ' doors'];
      if(o.id === 'loft') return ['≈ ' + inr(up) + ' incl. design', 'Loft run ' + round1(r.loft) + ' ft · ' + round1(Math.max(0, r.height - LOFT_OFFSET)) + ' ft high', p.doors.loft + ' doors'];
      if(o.id === 'tall') return ['≈ ' + inr(up) + ' incl. design', 'Fixed 4 sq ft carcass', 'No doors or handles'];
      return ['Saves ' + inr(Math.abs(up)), '−2 ft base, wall and splash', 'Loft run unchanged'];
    }
    case 'board': return [inr(RATES.board[o.id]) + ' per sq ft', round1(p.carcass.total) + ' sq ft carcass · ' + inr(p.breakdown.CP)];
    case 'finish': return [inr(RATES.finish[o.id]) + ' per sq ft', round1(p.carcass.total) + ' sq ft · ' + inr(p.breakdown.FP)];
    case 'handle': return [inr(RATES.handle[o.id]) + ' per handle', p.handles + ' handles · ' + inr(p.breakdown.HP)];
    case 'counter': return [inr(RATES.counter[o.id]) + ' per sq ft', round1(r.base * COUNTER_DEPTH) + ' sq ft · ' + inr(p.breakdown.CTP)];
    case 'backsplash': return [inr(RATES.backsplash[o.id]) + ' per sq ft', round1(r.grossBase * SPLASH_HEIGHT) + ' sq ft · ' + inr(p.breakdown.BSP)];
    case 'sinkMaterial': return [inr(RATES.sinkMaterial[o.id]) + ' per sink', '× ' + RATES.sinkType[p.sinkT.id] + ' for ' + p.sinkT.name];
    case 'sinkType': return ['Multiplier × ' + RATES.sinkType[o.id], inr(RATES.sinkMaterial[p.sinkMat.id] * RATES.sinkType[o.id]) + ' for ' + p.sinkMat.name];
    case 'faucet': return [inr(RATES.faucet[o.id]) + ' each', FAUCET_COUNT + ' faucet in this quote'];
    case 'hingeBrand': return [inr(RATES.hinge[o.id][fn.id]) + ' per hinge', p.hinges + ' hinges · ' + inr(p.breakdown.HiP)];
    case 'hingeFunction': return [inr(RATES.hinge[brand.id][o.id]) + ' per hinge', p.hinges + ' hinges · ' + inr(p.breakdown.HiP)];
    case 'lighting': return [inr(RATES.lighting[o.id]) + ' per ft', round1(r.grossBase) + ' ft · ' + inr(p.breakdown.LP)];
    case 'accessories': {
      const q = Number(state.acc[o.id]) || 0;
      return [inr(RATES.accessory[o.id]) + ' each', (q || 0) + ' in this quote · ' + inr(q * RATES.accessory[o.id])];
    }
  }
  return [];
}

const LAST = STEPS.length - 1;
const SKIP_GROUP = { counter:'counter', backsplash:'backsplash', sinkMaterial:'sink', sinkType:'sink', faucet:'faucet', lighting:'lighting' };
const SIZE = STEPS.findIndex(s => s.id === 'size');
const DETAILS = STEPS.findIndex(s => s.id === 'details');

function complete(i = state.step){
  const s = STEPS[i];
  if(s.id === 'size') return sizeOk();
  if(s.id === 'details' || s.id === 'quote') return !!state.lead;
  if(s.multi === 'units') return ['base','wall','loft','tall'].some(k => state.units[k]);
  if(s.multi === 'acc') return true;
  const sg = SKIP_GROUP[s.id];
  if(sg && state.skip[sg]) return true;
  if(s.key) return !!state[s.key];
  return true;
}
function isOn(step, id){
  if(step.multi === 'units') return !!state.units[id];
  if(step.multi === 'acc') return (Number(state.acc[id]) || 0) > 0;
  return state[step.key] === id;
}
const sizeOk = () => hasSize() && Number(state.h) > 0;

/* ============================================================
   RENDER + NAVIGATION
   ============================================================ */
function draw(){
  const step = STEPS[state.step];
  document.body.classList.toggle('start', step.id === 'start');
  document.body.classList.toggle('light', step.id === 'details');
  document.body.classList.toggle('doc', step.id === 'quote');
  stage.innerHTML = step.id === 'start' ? viewStart()
    : step.id === 'size' ? viewSize()
    : step.id === 'details' ? viewDetails()
    : step.id === 'quote' ? viewQuote()
    : viewOptions(step);
  updateSize();
  updateBar();
  const h = stage.querySelector('h1');
  if(h) h.focus({ preventScroll: true });
  save();
}
let busy = false;
let submitting = false;
function transition(change, dir = 1){
  if(busy) return;
  busy = true;
  stage.style.setProperty('--d', dir);
  stage.classList.add('out');
  setTimeout(() => {
    change(); save(); draw();
    stage.classList.remove('out');
    stage.classList.add('in');
    void stage.offsetWidth;
    stage.classList.remove('in');
    busy = false;
  }, 240);
}
function go(n){
  n = Math.max(0, Math.min(LAST, n));
  if(n === LAST && !state.lead) n = DETAILS;
  if(n !== state.step) transition(() => { state.step = n; }, n > state.step ? 1 : -1);
}
function chosen(st){
  if(st.id === 'size') return hasSize() ? state.l + ' × ' + state.b + ' × ' + state.h + ' ft' : '';
  if(st.id === 'details') return state.lead ? state.name : '';
  if(st.id === 'quote') return '';
  const sg = SKIP_GROUP[st.id];
  if(sg && state.skip[sg]) return 'Skipped';
  if(st.multi === 'units'){
    const names = UNITS.filter(u => state.units[u.id]).map(u => u.name);
    return names.length ? names.join(' + ') : '';
  }
  if(st.multi === 'acc'){
    const n = ACCESSORIES.reduce((t, a) => t + (Number(state.acc[a.id]) || 0), 0);
    return n ? n + ' items' : '';
  }
  if(st.key){
    const o = byId(st.opts, state[st.key]);
    return o ? o.name : '';
  }
  return '';
}
function updateBar(){
  const i = state.step, p = price();
  $('back').disabled = i <= 1;
  $('total').textContent = inr(p.total);
  $('estLbl').textContent = p.assumed ? 'Est. · ' + ROOM.l + '×' + ROOM.b + ' ft room' : 'Estimate';
  $('dock').classList.toggle('gone', i >= DETAILS);
  $('dockStep').textContent = STEPS[i].eyebrow || '';
  $('dots').innerHTML = STEPS.slice(1).map((_, k) => {
    const n = k + 1;
    return `<i class="${n < i ? 'done' : n === i ? 'cur' : ''}"></i>`;
  }).join('');
  $('dockMenu').innerHTML = STEPS.slice(1).map((st, k) => {
    const n = k + 1;
    return `<button type="button" data-jump="${n}" class="${n === i ? 'cur' : complete(n) && n < i ? 'done' : ''}">
      <span class="n">${String(n).padStart(2, '0')}</span><span>${esc(st.eyebrow)}</span><em>${esc(chosen(st))}</em></button>`;
  }).join('');
}

/* ============================================================
   EVENTS
   ============================================================ */
stage.addEventListener('click', e => {
  const opt = e.target.closest('[data-pick]');
  if(opt){
    if(busy) return;
    const step = STEPS[state.step], id = opt.dataset.pick;
    if(step.multi === 'units'){
      state.units[id] = !state.units[id];
      const card = opt.closest('.opt');
      card.classList.toggle('on', state.units[id]);
      opt.setAttribute('aria-pressed', state.units[id]);
      stage.querySelectorAll('.opt').forEach(c => {
        const h = c.querySelector('[data-pick]');
        const unit = byId(UNITS, h.dataset.pick);
        const pr = c.querySelector('.pr');
        if(pr) pr.textContent = optLabel(step, unit);
        const d = c.querySelector('.detail');
        if(d) d.innerHTML = `<b>${esc(unit.name)}</b>` + detailLines(step, unit).map(t => `<span>${esc(t)}</span>`).join('');
      });
      const cont = document.querySelector('.head-action .btn');
      if(cont) cont.disabled = !complete(state.step);
      updateBar(); save();
      return;
    }
    if(step.multi === 'acc'){
      const card = opt.closest('.opt');
      state.acc[id] = (Number(state.acc[id]) || 0) > 0 ? 0 : 1;
      card.classList.toggle('on', state.acc[id] > 0);
      opt.setAttribute('aria-pressed', state.acc[id] > 0);
      const span = card.querySelector('.qty span');
      if(span) span.textContent = state.acc[id];
      const det = card.querySelector('.detail span:last-child');
      if(det) det.textContent = state.acc[id] + ' in this quote · ' + inr(state.acc[id] * RATES.accessory[id]);
      updateBar();
      const btn = document.querySelector('.head-action .btn');
      if(btn) btn.textContent = ACCESSORIES.some(a => Number(state.acc[a.id]) > 0) ? 'Continue →' : 'Skip →';
      save();
      return;
    }
    const sg = SKIP_GROUP[step.id];
    if(sg) state.skip[sg] = false;
    state[step.key] = id; save();
    stage.querySelectorAll('.opt').forEach(o => { o.classList.toggle('on', o === opt.closest('.opt')); o.setAttribute('aria-pressed', o === opt.closest('.opt')); });
    stage.querySelector('.grid').classList.add('picked');
    updateBar();
    setTimeout(() => go(state.step + 1), 320);
    return;
  }
  const qty = e.target.closest('[data-act="qty"]');
  if(qty){
    const id = qty.dataset.id;
    const n = Math.max(0, Math.min(9, (Number(state.acc[id]) || 0) + Number(qty.dataset.d)));
    state.acc[id] = n;
    const card = qty.closest('.opt');
    const span = card.querySelector('.qty span');
    if(span) span.textContent = n;
    const det = card.querySelector('.detail span:last-child');
    if(det) det.textContent = n + ' in this quote · ' + inr(n * RATES.accessory[id]);
    card.classList.toggle('on', n > 0);
    const hit = card.querySelector('[data-pick]');
    if(hit) hit.setAttribute('aria-pressed', n > 0);
    updateBar();
    const btn = document.querySelector('.head-action .btn');
    if(btn) btn.textContent = ACCESSORIES.some(a => Number(state.acc[a.id]) > 0) ? 'Continue →' : 'Skip →';
    save();
    return;
  }
  const bump = e.target.closest('[data-bump]');
  if(bump){
    const k = bump.dataset.bump, cur = Number(state[k]);
    state[k] = String(cur > 0 ? Math.max(1, cur + Number(bump.dataset.d)) : firstValue(k));
    save(); updateSize(true); updateBar(); return;
  }
  const pre = e.target.closest('[data-preset]');
  if(pre){
    [state.l, state.b] = pre.dataset.preset.split(',');
    if(!(Number(state.h) > 0)) state.h = '9';
    save(); updateSize(true); updateBar(); return;
  }
  const g = e.target.closest('[data-go]');
  if(g && g.disabled) return;
  if(g){ go(Number(g.dataset.go)); return; }
  const act = e.target.closest('[data-act]');
  if(!act) return;
  const a = act.dataset.act;
  if(a === 'skip'){
    const g = act.dataset.group;
    if(g){ state.skip[g] = true; save(); go(state.step + 1); }
  }
  else if(a === 'wa') whatsapp();
  else if(a === 'print') window.print();
  else if(a === 'reset'){
    if(planUrl) URL.revokeObjectURL(planUrl); planUrl = '';
    transition(() => { state = fresh(); }, -1);
  }
  else if(a === 'back') go(state.step - 1);
  else if(a === 'edit') go(1);
  else if(a === 'pick-plan') $('planInput').click();
  else if(a === 'remove-plan'){
    if(planUrl) URL.revokeObjectURL(planUrl); planUrl = '';
    state.plan = null; state.planError = ''; draw();
  }
  else if(a === 'clear-leads'){
    if(confirm('Clear all saved leads on this device?')){ localStorage.removeItem(LEADS); drawLeads(); }
  }
});
stage.addEventListener('input', e => {
  const k = e.target.dataset.dim;
  if(k){ state[k] = e.target.value; save(); updateSize(); updateBar(); }
  if(['name','phone','email','city'].includes(e.target.name)){ state[e.target.name] = e.target.value; save(); }
});
stage.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.dataset.dim && sizeOk()) go(state.step + 1);
});
document.addEventListener('change', e => {
  if(e.target.id !== 'planInput') return;
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const ok = /^(application\/pdf|image\/(jpeg|png))$/.test(f.type) || /\.(pdf|jpe?g|png)$/i.test(f.name);
  if(!ok){ state.planError = 'Use a PDF, JPG or PNG.'; e.target.value = ''; draw(); return; }
  if(f.size > 10 * 1024 * 1024){ state.planError = 'Keep the plan under 10 MB.'; e.target.value = ''; draw(); return; }
  if(planUrl) URL.revokeObjectURL(planUrl);
  planUrl = URL.createObjectURL(f);
  state.plan = { name:f.name, type:f.type || (/\.pdf$/i.test(f.name) ? 'application/pdf' : 'image/jpeg'), size:f.size };
  state.planError = '';
  e.target.value = '';
  draw();
});
stage.addEventListener('submit', e => {
  e.preventDefault();
  if(submitting) return;
  const okName = state.name.trim().length > 1;
  const digits = state.phone.replace(/\D/g, '');
  const okPhone = digits.length >= 10 && digits.length <= 13;
  const okCity = state.city.trim().length > 1;
  const email = state.email.trim();
  const okEmail = !email || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  $('en').textContent = okName ? '' : 'Please add your name.';
  $('ep').textContent = okPhone ? '' : 'Enter a 10-digit mobile number.';
  $('ee').textContent = okEmail ? '' : 'Enter a valid email or leave it blank.';
  $('ec').textContent = okCity ? '' : 'Please add your city.';
  if(!okName || !okPhone || !okCity || !okEmail) return;

  submitting = true;
  setTimeout(() => { submitting = false; }, 1200);
  const p = price();
  const lead = { id: 'HS-' + Date.now().toString(36).toUpperCase(), at: new Date().toISOString() };
  const record = {
    id: lead.id, at: lead.at,
    name: state.name.trim(), phone: state.phone.trim(), email: email, city: state.city.trim(),
    plan: state.plan || null,
    total: p.total,
    lines: p.lines,
    selections: {
      layout: state.layout, l: state.l, b: state.b, h: state.h, units: state.units,
      board: state.board, finish: state.finish, handle: state.handle, counter: state.counter,
      backsplash: state.backsplash, sinkMaterial: state.sinkMaterial, sinkType: state.sinkType,
      faucet: state.faucet, hingeBrand: state.hingeBrand, hingeFunction: state.hingeFunction,
      lighting: state.lighting, acc: state.acc
    },
    breakdown: p.breakdown
  };
  saveLead(record);
  lead.delivery = CONFIG.leadEndpoint ? 'sending' : 'local';
  state.lead = lead;
  transition(() => { state.step = LAST; });
  if(CONFIG.leadEndpoint){
    const message = [
      'Kitchen quote ' + lead.id,
      'Name: ' + record.name,
      'Phone: ' + record.phone,
      record.email ? 'Email: ' + record.email : '',
      'City: ' + record.city,
      'Total: ' + inr(record.total) + ' (including design)',
      '',
      ...p.lines.map(l => `${l.d} — ${l.q}${l.u ? ' ' + l.u : ''} — ${inr(l.a)}`)
    ].filter(Boolean).join('\n');
    const payload = { ...record, access_key: CONFIG.leadAccessKey || undefined,
      subject: 'New kitchen lead · ' + lead.id,
      from_name: CONFIG.leadCompany || 'Homesic website',
      message };
    if(!record.email) delete payload.email;
    const formPost = /web3forms\.com/i.test(CONFIG.leadEndpoint);
    if(formPost){
      // Web3Forms does not send CORS headers, so use its normal HTML form POST into a
      // hidden iframe. The page stays on the quote and the studio gets the email.
      const wf = $('wfForm');
      wf.action = CONFIG.leadEndpoint;
      wf.innerHTML = '';
      const add = (k, v) => {
        if(v === undefined || v === null || v === '') return;
        const i = document.createElement('input');
        i.type = 'hidden'; i.name = k; i.value = typeof v === 'string' ? v : JSON.stringify(v);
        wf.appendChild(i);
      };
      add('access_key', CONFIG.leadAccessKey);
      add('subject', payload.subject);
      add('from_name', payload.from_name);
      add('name', record.name);
      add('email', record.email);
      add('phone', record.phone);
      add('city', record.city);
      add('quote_id', record.id);
      add('total', record.total);
      add('plan', record.plan);
      add('selections', record.selections);
      add('breakdown', record.breakdown);
      add('message', payload.message);
      let marked = false;
      const mark = () => {
        if(marked) return;
        marked = true;
        if(state.lead && state.lead.id === lead.id && state.lead.delivery !== 'sent'){
          state.lead.delivery = 'sent'; save();
          if(state.step === LAST) draw();
        }
      };
      const frame = $('wfTarget');
      frame.onload = () => setTimeout(mark, 250);
      setTimeout(mark, 2500);
      wf.submit();
    } else {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 12000);
      fetch(CONFIG.leadEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload),
        signal: ctrl.signal
      })
        .then(r => { clearTimeout(timer); if(!r.ok) throw new Error('HTTP ' + r.status); return r.json().catch(() => ({})); })
        .then(j => {
          if(j && j.success === false) throw new Error('rejected');
          if(state.lead && state.lead.id === lead.id){
            state.lead.delivery = 'sent'; save();
            if(state.step === LAST) draw();
          }
        })
        .catch(() => {
          clearTimeout(timer);
          if(state.lead && state.lead.id === lead.id){
            state.lead.delivery = 'failed'; save();
            if(state.step === LAST) draw();
          }
        });
    }
  } else {
    save();
  }
});
$('back').addEventListener('click', () => go(state.step - 1));
const dock = $('dock');
$('dockCur').addEventListener('click', () => {
  const open = dock.classList.toggle('open');
  $('dockCur').setAttribute('aria-expanded', open);
});
$('dockMenu').addEventListener('click', e => {
  const b = e.target.closest('[data-jump]');
  if(!b) return;
  dock.classList.remove('open');
  go(Number(b.dataset.jump));
});
document.addEventListener('click', e => { if(!dock.contains(e.target)) dock.classList.remove('open'); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') dock.classList.remove('open'); });
$('home').addEventListener('click', e => { e.preventDefault(); go(0); });

function whatsapp(){
  const p = price();
  const layout = byId(LAYOUTS, state.layout) || byId(LAYOUTS, 'lshape');
  const text = ['Hi Homesic, I would like a quote for my kitchen.',
    'Ref: ' + (state.lead ? state.lead.id : '—'),
    'Name: ' + state.name + (state.city ? ' · ' + state.city : ''),
    layout.name + ' · ' + state.l + ' × ' + state.b + ' × ' + state.h + ' ft (L × B × H)',
    ...p.lines.map(l => l.d + ': ' + l.q + ' ' + l.u + ' × ' + inr(l.r) + ' = ' + inr(l.a)),
    'Grand total: ' + inr(p.total)].join('\n');
  window.open('https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
}

if(/[?&]leads=1/.test(location.search)) drawLeads();
else draw();
</script>
</body>

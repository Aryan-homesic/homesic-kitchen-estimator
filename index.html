<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="theme-color" content="#121110">
<title>Homesic · Modular kitchen price</title>
<meta name="description" content="Price your modular kitchen in a few minutes. Real rates, free site visit, 10-year service warranty.">
<link rel="icon" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* pastel sketch palette, derived from the illustration set */
  --bg:#FFF8F7;          /* blush paper */
  --paper:#FFFDFC;
  --white:#FFFFFF;
  --frame:#FBEFF1;       /* pale pink wash */
  --grid:rgba(74,59,66,.03);
  --ink:#453A40;         /* warm charcoal, the pencil line */
  --ink2:#6B5A61;
  --muted:#A08E94;
  --faint:#C2B2B7;
  --line:#F0E1E4;
  --line2:#E4CDD3;
  --accent:#E39AAC;      /* pastel rose */
  --accent-d:#C4708A;    /* deeper rose for text */
  --accent-bg:rgba(227,154,172,.16);
  --ok:#8FB3A2;
  --warn:#C97C6B;
  --r:16px;
  --display:Jost,"Futura","Avenir Next",ui-sans-serif,system-ui,sans-serif;
  --serif:Lora,Georgia,"Times New Roman",serif;
  --hand:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
h1,h2{margin:0;font-family:var(--display);font-weight:500;letter-spacing:-.6px;line-height:1.08}
h1{font-size:clamp(26px,3.4vw,42px)}
h2{font-size:22px;letter-spacing:-.2px}
h1:focus{outline:none}
p{margin:0}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:2.2px;text-transform:uppercase;font-weight:500;color:var(--accent);margin-bottom:8px}
.hint{font-size:13px;color:var(--muted)}

/* ---------- shell ---------- */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.top{flex:none;border-bottom:1px solid var(--line);background:rgba(18,17,16,.82);transition:background .5s,border-color .5s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top)}
.top .in{max-width:1180px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-right:auto}
.brand svg{width:30px;height:30px;flex:none}
.brand-logo{width:26px;height:auto;flex:none;display:block}
.brand b{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:3px}
.brand small{display:block;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-top:-2px}

/* ---------- floating step dock ---------- */
.dock{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;transition:opacity .4s,transform .5s var(--ease)}
body.start .dock,.dock.gone{opacity:0;transform:translate(-50%,24px);pointer-events:none}
.dock-bar{display:flex;align-items:center;gap:4px;padding:6px 16px 6px 6px;background:rgba(32,30,28,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid rgba(255,255,255,.1);border-radius:999px;box-shadow:0 24px 48px -18px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06)}
.dock-btn{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--ink);display:grid;place-items:center;font-size:16px;transition:background .2s,opacity .2s}
.dock-btn:hover:not(:disabled){background:rgba(255,255,255,.16)}
.dock-btn:disabled{opacity:.3;cursor:default}
.dock-cur{display:flex;flex-direction:column;align-items:flex-start;gap:5px;border:0;background:none;padding:4px 12px;font-family:var(--display);font-size:14px;color:var(--ink);line-height:1}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);transition:width .3s var(--ease),background .3s}
.dots i.done{background:var(--accent)}
.dots i.cur{width:18px;background:var(--ink)}
.dock-sep{width:1px;height:28px;background:rgba(255,255,255,.12);margin:0 6px}
.est{line-height:1.1}
.est span{display:block;font-family:var(--display);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.est b{font-family:var(--display);font-weight:500;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.est.bump b{animation:bump .5s var(--ease)}
@keyframes bump{40%{color:var(--accent);transform:translateY(-1px)}}
.dock-menu{position:absolute;left:50%;bottom:calc(100% + 12px);width:300px;padding:8px;transform:translate(-50%,10px) scale(.97);transform-origin:50% 100%;
  background:rgba(32,30,28,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);border-radius:18px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.9);opacity:0;pointer-events:none;transition:opacity .2s,transform .3s var(--ease);
  max-height:min(78vh,700px);overflow-y:auto;overscroll-behavior:contain}
.dock-menu::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px}
.dock.open .dock-menu{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
@media (hover:hover){ .dock:hover .dock-menu{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)} }
.dock-menu button{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;width:100%;padding:7px 10px;border:0;border-radius:11px;background:none;color:var(--ink2);text-align:left;font-size:14px;transition:background .15s}
.dock-menu button:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.dock-menu button.cur{background:var(--accent-bg);color:var(--ink)}
.dock-menu .n{font-family:var(--display);font-size:11px;letter-spacing:1px;color:var(--muted)}
.dock-menu button.done .n{color:var(--accent)}
.dock-menu em{font-style:normal;font-size:12.5px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:500;font-size:14px;transition:background .15s,border-color .15s,opacity .2s;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent)}
.btn:disabled{background:transparent;color:var(--muted);border-color:var(--line2);cursor:not-allowed}
.btn.lg{padding:16px 30px;font-size:15px}
.btn.line{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.line:hover{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,.dock button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- stage + transitions ---------- */
#stage{flex:1;min-height:0;width:100%;max-width:1180px;margin:0 auto;padding:28px 24px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  transition:opacity .26s ease,transform .32s var(--ease),filter .26s ease}
body:not(.start) #stage{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
#stage.out{opacity:0;transform:translateY(calc(var(--d,1) * -16px)) scale(.985);filter:blur(6px)}
#stage.in{opacity:0;transform:translateY(calc(var(--d,1) * 22px));filter:blur(4px);transition:none}
.head{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.head-copy{min-width:0}
.head .hint{margin-top:6px}
.head-action{flex:none;display:flex;gap:8px;margin-top:2px}
.head-action .btn{padding:11px 18px}

/* ---------- page hero strip (storage) ---------- */
.phero{flex:none;margin:2px 0 12px;border-radius:6px;overflow:hidden;background:var(--frame);animation:rise .4s var(--ease) both}
.phero img{display:block;width:100%;height:auto}

/* storage unit tiles — same footprint as the shape options */
.ugrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:none}
.ucard .fimg{aspect-ratio:1}
.ucard .fmeta{padding:7px 9px 8px}
@media (min-width:760px){ .ugrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px} }
.fcard .tick{position:absolute;right:6px;bottom:6px;top:auto;width:22px;height:22px;z-index:3;border-radius:50%;opacity:0;
  display:grid;place-items:center;background:rgba(12,11,10,.55);border:1px solid rgba(255,255,255,.32);color:transparent;font-size:11px;font-weight:700;transition:opacity .15s}
.fcard.on .tick{opacity:1;background:var(--accent);border-color:var(--accent);color:var(--bg)}

/* square photo tiles (handles, finishes, units) */
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:none}
.tgrid .fimg{aspect-ratio:1}
.tgrid.wide .fimg{aspect-ratio:4 / 3;background:rgba(18,17,16,.62)}
.tgrid.wide .fimg img{object-fit:contain;padding:6%}
.tgrid.wide.photo .fimg img{object-fit:cover;padding:0}
/* small circular material swatches */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;flex:none}
.mgrid .fcard{border:0;background:transparent;align-items:center;padding:0}
.mgrid .fimg{aspect-ratio:1;background:transparent;border-radius:50%;width:100%;overflow:visible}
.mgrid .fimg img{object-fit:cover;padding:0;border-radius:50%}
.mgrid .fcard.on .fimg{box-shadow:0 0 0 2px var(--accent)}
.mgrid .fmeta{align-items:center;padding:6px 0 0;text-align:center}
.mgrid .fname{font-size:10.5px}
.mgrid .frate{font-size:10px}
.mgrid .tick{right:0;bottom:0;width:16px;height:16px;font-size:9px}
.mgrid .zoom{display:none}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px;font-family:var(--display);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.chip{border:1px solid var(--line2);background:transparent;color:var(--ink2);border-radius:999px;padding:4px 11px;font-size:11px;font-family:Inter,sans-serif;letter-spacing:.2px;text-transform:none}
.chip:hover{border-color:var(--ink2)}
.chip.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-d)}
.ucard.muted{opacity:.35}
.ph-none{display:grid;place-items:center;width:100%;height:100%;padding:10px;text-align:center;
  color:var(--muted);font-family:var(--display);font-size:11px;letter-spacing:1px;text-transform:uppercase;
  border:1px dashed var(--line2);border-radius:4px;background:rgba(18,17,16,.35)}
@media (min-width:760px){ .tgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px} }

/* ---------- build: board + finish on one screen ---------- */
.bsec{flex:none;display:flex;align-items:center;gap:10px;margin-top:12px}
.blabel{flex:none;width:42px;font-family:var(--display);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.seg{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.segbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border:1px solid var(--line2);border-radius:5px;background:transparent;color:var(--ink2);
  font-family:var(--display);font-size:13.5px;white-space:nowrap;transition:border-color .15s,background .15s,color .15s}
.segbtn:hover{border-color:var(--ink2)}
.segbtn.on{border-color:var(--accent);background:var(--accent-bg);color:var(--ink)}
.bhead{flex:none;display:flex;align-items:baseline;gap:8px;margin:14px 0 6px;font-family:var(--display);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.bhead span{font-family:Inter,sans-serif;font-size:11px;letter-spacing:0;text-transform:none;color:var(--ink2);opacity:.7}
.fgrid{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fcard{display:flex;flex-direction:column;padding:0;border:1px solid var(--line2);border-radius:6px;overflow:hidden;
  background:transparent;color:var(--ink2);text-align:left;transition:border-color .15s,background .15s,color .15s}
.fimg{position:relative;display:block;width:100%;aspect-ratio:1;background:var(--frame);overflow:hidden}
.fimg img{display:block;width:100%;height:100%;object-fit:cover}
.fmeta{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:6px 8px 7px;min-width:0}
.fcard:hover{border-color:var(--ink2)}
.fcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fcard.on .fmeta{background:var(--accent-bg)}
.fname{font-family:var(--display);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frate{margin-left:0;font-size:11px;color:var(--accent-d);font-variant-numeric:tabular-nums;white-space:nowrap}
.frate small{font-size:9px;color:var(--muted)}
.zoom{position:absolute;right:6px;top:6px;display:grid;place-items:center;width:24px;height:24px;border-radius:4px;
  background:rgba(12,11,10,.62);border:1px solid rgba(255,255,255,.28);color:#eee;font-size:12px;cursor:zoom-in;z-index:3}
.zoom:hover{background:rgba(12,11,10,.85)}
.photo-view{position:fixed;inset:0;z-index:60;display:grid;place-items:center;gap:10px;padding:24px;background:rgba(8,7,6,.96);animation:fade .2s ease both}
.photo-view[hidden]{display:none}
.photo-view img{max-width:94vw;max-height:84vh;object-fit:contain;border-radius:6px;box-shadow:0 30px 80px -30px #000}
.photo-view figcaption{font-family:var(--display);font-size:13px;color:var(--ink2);letter-spacing:.4px}
.pv-close{position:absolute;top:14px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:rgba(32,30,28,.9);color:var(--ink);font-size:15px}
@keyframes fade{from{opacity:0}}
.addon{flex:none;display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:10px 12px;text-align:left;
  border:1px dashed var(--line2);border-radius:6px;background:transparent;color:var(--ink2);transition:border-color .15s,background .15s}
.addon:hover:not(:disabled){border-color:var(--ink2)}
.addon:disabled{opacity:.55;cursor:default}
.addon.on{border-style:solid;border-color:var(--accent);background:var(--accent-bg);color:var(--ink)}
.aico{flex:none;display:grid;place-items:center;width:20px;height:20px;border:1px solid var(--line2);border-radius:4px;font-size:11px;color:transparent}
.addon.on .aico{border-color:var(--accent);background:var(--accent);color:var(--bg)}
.acopy{display:flex;flex-direction:column;gap:1px;min-width:0}
.acopy b{font-family:var(--display);font-weight:500;font-size:13px}
.acopy span{font-size:11px;color:var(--muted)}
.aamt{margin-left:auto;font-size:12px;color:var(--accent-d);font-variant-numeric:tabular-nums;white-space:nowrap}
.cmpwrap{flex:none;margin-top:12px;padding:8px 10px 7px;border:1px solid var(--line);border-radius:6px;background:rgba(18,17,16,.55)}
.cmpwrap h3{margin:0 0 5px;font-family:var(--display);font-weight:500;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.cmpwrap table{width:100%;border-collapse:collapse;font-size:11px}
.cmpwrap th,.cmpwrap td{text-align:left;padding:4px 3px;border-top:1px solid var(--line);color:var(--ink2);font-weight:400}
.cmpwrap thead th{color:var(--muted);font-size:9px;letter-spacing:.7px;text-transform:uppercase;border-top:0;padding-bottom:2px}
.cmpwrap tbody th{width:25%;color:var(--muted);font-weight:500}
.cmpwrap tbody tr:last-child td{color:var(--accent-d)}
@media (min-width:760px){
  .fgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .bsec{margin-top:14px}
}
@media (max-width:420px){
  .blabel{width:34px;font-size:9px;letter-spacing:1px}
  .fname{font-size:12.5px}
  .frate{font-size:11px}
}

/* ---------- option grid ---------- */
.grid{flex:0 1 auto;min-height:0;display:grid;gap:14px;grid-template-columns:repeat(var(--c),minmax(0,1fr));grid-auto-rows:minmax(0,var(--rh))}
.after{flex:none;display:flex;justify-content:flex-end;margin-top:18px;animation:rise .45s var(--ease) both}
.opt{position:relative;display:flex;flex-direction:column;min-height:0;padding:0;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  transition:border-color .2s,box-shadow .2s,opacity .3s,transform .3s var(--ease);animation:rise .45s var(--ease) both;animation-delay:calc(var(--i) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.opt:hover{border-color:var(--line2);box-shadow:0 18px 40px -24px rgba(0,0,0,.8)}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.grid.picked .opt:not(.on){opacity:.25;transform:scale(.97)}
.ph{position:absolute;inset:0;margin:0;border-radius:0;background:transparent;overflow:hidden;isolation:isolate}
.ph img{width:100%;height:100%;object-fit:cover;object-position:var(--o,center);transform:scale(var(--z,1));transform-origin:var(--o,center);
  mix-blend-mode:multiply;filter:saturate(.9) contrast(1.02);transition:transform .7s var(--ease)}
.ph img.fit{object-fit:contain;padding:12% 8%;transform:none}
.opt:hover .ph img{transform:scale(calc(var(--z,1) * 1.06))}
.opt:hover .ph img.fit{transform:scale(1.04)}
.ph > svg{width:100%;height:100%;padding:8% 12%}
.meta{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:34px 12px 10px;display:flex;flex-direction:column;gap:1px;min-width:0;
  background:linear-gradient(180deg,rgba(12,11,10,0) 0%,rgba(12,11,10,.42) 40%,rgba(12,11,10,.9) 76%,rgba(12,11,10,.96) 100%)}
.nm{font-family:var(--display);font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.nm em{font-style:normal;font-family:var(--display);font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;background:rgba(201,138,91,.22);color:var(--accent-d);padding:2px 6px;border-radius:2px;white-space:nowrap;text-shadow:none}
.ds{font-size:12px;color:var(--ink2);opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-size:12.5px;font-weight:600;color:var(--accent-d);font-variant-numeric:tabular-nums}
.tick{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(18,17,16,.55);border:1px solid rgba(255,255,255,.35);color:transparent;font-size:12px;font-weight:700}
.opt.on .tick{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.opt-hit{position:relative;display:flex;flex-direction:column;flex:1;min-height:0;width:100%;padding:0;border:0;background:none;color:inherit;text-align:left;font:inherit;cursor:pointer;overflow:hidden}
.opt-hit:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.qtybar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.qlabel{font-family:var(--display);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.qty button{width:30px;height:28px;border:0;background:rgba(255,255,255,.06);color:var(--ink);font-size:15px;line-height:1}
.qty button:hover{background:var(--accent-bg)}
.qty span{min-width:26px;text-align:center;font-size:13px;font-weight:600}

/* extra detail on hover / keyboard focus */
.detail{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;gap:3px;padding:12px 14px;
  background:linear-gradient(180deg,rgba(18,17,16,.93),rgba(18,17,16,.99));border-top:1px solid var(--accent);
  transform:translateY(102%);transition:transform .28s var(--ease);pointer-events:none}
.opt:hover .detail,.opt:focus-visible .detail{transform:translateY(0)}
.detail b{font-family:var(--display);font-size:14px;font-weight:500;color:var(--ink)}
.detail span{font-size:12px;line-height:1.35;color:var(--ink2)}
.detail span:first-of-type{color:var(--accent-d);font-weight:500}
.ph-none{display:grid;place-items:center;width:100%;height:100%;min-height:120px;padding:12px;
  color:var(--muted);font-family:var(--display);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;
  border:1px dashed var(--line2);border-radius:4px}
@media (hover:none){ .detail{display:none} }

/* ---------- start ---------- */
.hero{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;max-width:560px}
.hero h1{font-size:clamp(38px,5.4vw,72px);letter-spacing:-1.6px;line-height:1}
.hero .lead{color:var(--ink2);font-size:16.5px;margin-top:16px;max-width:440px}
.hero .hint{color:var(--ink2)}
.from{margin:28px 0;padding:16px 0;border-top:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.18)}
.hero > *{animation:rise .8s var(--ease) both}
.hero > :nth-child(2){animation-delay:.08s}.hero > :nth-child(3){animation-delay:.16s}.hero > :nth-child(4){animation-delay:.24s}.hero > :nth-child(5){animation-delay:.32s}.hero > :nth-child(6){animation-delay:.4s}
.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;opacity:1;transition:opacity .7s ease;pointer-events:none}
body.light .backdrop{opacity:0}
.backdrop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 50%;filter:brightness(.8);animation:kb 22s ease-out both}
@keyframes kb{from{transform:scale(1.08)}}
.backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,11,10,.96) 0%,rgba(12,11,10,.82) 32%,rgba(12,11,10,.25) 62%,rgba(12,11,10,.1) 100%),linear-gradient(180deg,rgba(12,11,10,.55),transparent 18%)}
/* quiz, size and quote pages sit on the same cover photo; a scrim keeps the type readable */
body:not(.start) .backdrop::after{
  background:linear-gradient(180deg,rgba(12,11,10,.80) 0%,rgba(12,11,10,.52) 36%,rgba(12,11,10,.62) 70%,rgba(12,11,10,.9) 100%);
}
body.start .top{background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.app{position:relative;z-index:1}
.from b{display:block;font-family:var(--display);font-weight:500;font-size:clamp(30px,3.4vw,42px);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.trust{display:flex;flex-wrap:wrap;gap:6px 18px;margin:18px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink2)}
.trust li::before{content:"✓";color:var(--ok);margin-right:6px;font-weight:700}

/* ---------- size ---------- */
.field label{display:block;font-family:var(--display);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;padding:14px;border:1px solid var(--line2);border-radius:4px;background:var(--white);font-family:var(--display);font-size:24px;min-width:0}
.field input:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
.field input::placeholder{color:#5E5850}
.field .err{color:var(--warn);font-size:12px;margin-top:4px}
.field .err:empty{display:none}
.sizewrap{width:100%;max-width:560px;margin:0 auto;align-self:flex-start}
.sizecard{width:100%;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:4px 24px 22px;animation:rise .45s var(--ease) both}
.presets{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.presets .hint{margin-right:4px}
.presets button{border:1px solid var(--line2);background:transparent;color:var(--ink2);border-radius:999px;padding:7px 14px;font-size:13px;font-variant-numeric:tabular-nums;transition:all .15s}
.presets button:hover,.presets button.on{border-color:var(--accent);background:var(--accent-bg);color:var(--ink)}
.dim{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.dim label{font-family:var(--display);font-size:18px;font-weight:500}
.stepper{display:flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:999px;padding:4px;transition:border-color .15s}
.stepper:focus-within{border-color:var(--accent)}
.stepper button{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:rgba(255,255,255,.06);color:var(--ink);font-size:20px;line-height:1}
.stepper button:hover{background:var(--accent-bg)}
.stepper input{width:58px;border:0;background:transparent;text-align:right;font-family:var(--display);font-size:22px;color:var(--ink);padding:0;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none}
.stepper input::placeholder{color:#5E5850}
.stepper span{color:var(--muted);font-size:13px;margin:0 8px 0 5px}
.sizefoot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:18px;flex-wrap:wrap}
#rRun{font-variant-numeric:tabular-nums;color:var(--ink2)}

/* ---------- light pages: details gate + quotation ---------- */
body{transition:background-color .6s ease}
body.light{--bg:#EFEAE2;--white:#fff;--ink:#1C1B19;--ink2:#47433D;--muted:#7A746B;--line:#E2DCD1;--line2:#CDC4B5;--grid:rgba(28,27,25,.045);
  --accent:#A4643A;--accent-d:#874F2B;--accent-bg:#F2E6DA;--ok:#3D6A4E}
body.light .top{background:rgba(239,234,226,.85)}
.brand svg rect{fill:var(--ink);transition:fill .6s}.brand svg path{stroke:var(--bg);transition:stroke .6s}
.gate{position:relative;margin:auto;width:100%;max-width:470px;background:#1C1B19;color:#F1ECE4;border-radius:16px;padding:36px 34px 28px;
  box-shadow:0 50px 90px -40px rgba(28,27,25,.75);animation:pop .6s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.gate .ready{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#9FD0AE;background:rgba(134,181,150,.12);border-radius:999px;padding:6px 12px 6px 6px;margin-bottom:18px}
.gate .ready i{font-style:normal;width:20px;height:20px;border-radius:50%;background:#86B596;color:#1C1B19;display:grid;place-items:center;font-size:11px;font-weight:700}
.gate h1{color:#fff;font-size:clamp(28px,3vw,36px)}
.gate .sub{color:#A9A194;margin:10px 0 24px;font-size:14px}
.gate form{display:flex;flex-direction:column;gap:14px}
.gate .field label{color:#CFC8BC}
.gate .field input{background:#262421;border-color:#3D3A35;color:#F1ECE4;font-family:Inter,sans-serif;font-size:16px;padding:14px}
.gate .field input:focus{border-color:#C98A5B;outline:2px solid rgba(201,138,91,.2)}
.gate .btn{width:100%;margin-top:6px;background:#F1ECE4;border-color:#F1ECE4;color:#1C1B19}
.gate .btn:hover{background:#C98A5B;border-color:#C98A5B}
.gate .err{color:#E3906F}
.gate .fine{margin-top:14px;text-align:center;font-size:12.5px;color:#958D80}
.gate-back{position:absolute;top:14px;right:18px;color:#A9A194;text-decoration:none}
.gate .opt-badge{margin-left:6px;font-family:var(--display);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#A9A194;border:1px solid #3D3A35;border-radius:999px;padding:2px 7px;vertical-align:1px}
.upload{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;font-size:14px;
  background:#262421;border:1px dashed #4A453E;border-radius:6px;color:#CFC8BC;transition:border-color .15s,background .15s}
.upload:hover{border-color:var(--accent);background:#2B2826}
.up-ico{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:rgba(201,138,91,.18);color:#DDA67C;font-size:16px;flex:none}
.up-meta{min-width:0;display:block}
.up-meta b{display:block;font-size:14px;color:#F1ECE4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-meta small{display:block;font-size:12px;color:#958D80}
.upload.has-file{background:#262421;border-style:solid;cursor:default}
.upload.has-file img{width:46px;height:46px;object-fit:cover;border-radius:4px;flex:none}
.pdfbadge{display:grid;place-items:center;width:46px;height:46px;border-radius:4px;background:rgba(201,138,91,.18);color:#DDA67C;font-weight:600;font-size:11px;letter-spacing:.5px;flex:none}

body.doc #stage{overflow-y:auto;padding-bottom:40px}
.qdoc{width:100%;max-width:900px;margin:0 auto}
.doc-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.doc-acts{display:flex;gap:8px;flex-wrap:wrap}
.paper{background:#fff;color:#1C1B19;border-radius:10px;padding:40px 44px;box-shadow:0 1px 2px rgba(28,27,25,.06),0 40px 80px -50px rgba(28,27,25,.45);animation:pop .7s var(--ease) both}
.paper-h{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:22px;border-bottom:2px solid #1C1B19}
.pbrand{display:flex;align-items:center;gap:12px}
.pbrand svg{width:38px;height:38px}
.paper-logo{width:42px;height:auto;display:block;flex:none}
.pbrand b{display:block;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:3.5px}
.pbrand small{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#7A746B}
.pmeta{text-align:right;font-size:12.5px;color:#7A746B;display:flex;flex-direction:column;gap:2px}
.pmeta b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;color:#1C1B19;letter-spacing:.5px}
.pinfo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:22px 0;border-bottom:1px solid #E2DCD1}
.pinfo span{display:block;font-family:var(--display);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#A4643A;margin-bottom:4px}
.pinfo b{display:block;font-weight:600;font-size:14px}
.pinfo i{display:block;font-style:normal;font-size:13px;color:#7A746B;margin-top:2px}
.items{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
.items th{font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#7A746B;text-align:left;padding:12px 8px;border-bottom:1px solid #E2DCD1}
.items td{padding:12px 8px;border-bottom:1px solid #EFEAE2;vertical-align:top;animation:rise .5s var(--ease) both;animation-delay:calc(.2s + var(--i) * 40ms)}
.items td:first-child,.items th:first-child{color:#A9A194;width:28px}
.items .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.items td.n:last-child{font-weight:600}
.items small{color:#A9A194;font-size:11px}
.ptotal{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:20px 8px;border-bottom:2px solid #1C1B19}
.ptotal span{font-family:var(--display);font-size:18px;font-weight:500;display:flex;flex-direction:column;gap:2px}
.ptotal small{font-family:Inter,sans-serif;font-size:11.5px;color:#7A746B;font-weight:400;letter-spacing:.4px;text-transform:uppercase}
.ptotal b{font-family:var(--display);font-weight:500;font-size:clamp(30px,4vw,40px);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.terms{padding:22px 0 6px}
.terms > p{font-family:var(--display);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#A4643A;margin-bottom:10px}
.terms > div{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.terms > div > div{background:#F7F4EF;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.terms b{font-family:var(--display);font-weight:500;font-size:20px}
.terms span{font-size:12px;color:#7A746B;line-height:1.3}
.terms i{font-style:normal;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;margin-top:4px}
.pnote{font-size:12px;color:#7A746B;margin-top:16px}
.doc-foot{text-align:center;color:var(--muted);font-size:13.5px;margin:22px 0 8px}
.delivery{font-size:12.5px;color:var(--muted);margin-top:5px}
.delivery.sending{color:var(--accent-d)}
.delivery.sent{color:var(--ok)}
.delivery.failed{color:var(--warn)}
.linkbtn{border:0;background:none;color:var(--accent-d);text-decoration:underline;padding:0;font-size:13.5px}

/* ---------- compact quote card (cream paper) ---------- */
.qcard{max-width:900px;margin:0 auto;padding:30px 28px;border:1px solid #EDDCC2;border-radius:18px;
  background:linear-gradient(180deg,#FFF8EE 0%,#FBF1E1 48%,#F7EBD7 100%);color:#1B1A18;
  box-shadow:0 40px 90px -50px rgba(0,0,0,.75),0 0 0 1px rgba(201,138,91,.14)}
.qc-head{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-start;
  padding-bottom:20px;border-bottom:1px solid #EDDCC2}
.qc-eyebrow{margin:0 0 8px;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#B07C42}
.qc-head h1{margin:0;font-size:clamp(23px,6.2vw,29px);letter-spacing:-.6px;color:#1B1A18;font-weight:500}
.qc-head h1 em{font-style:normal;color:#8A5A2B}
.qc-sub{margin:10px 0 0;font-size:12px;line-height:1.55;color:#6F6A62;max-width:44ch}
.qc-actions{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.qc-total{text-align:right}
.qc-total b{display:block;font-family:var(--display);font-size:clamp(24px,6.6vw,32px);color:#1B1A18;line-height:1}
.qc-total span{display:block;margin-top:5px;font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:#B4703A}
.qc-dl{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;border:0;
  background:linear-gradient(180deg,#CE8B43 0%,#B5732C 100%);color:#FFF9F0;font-size:12.5px;font-weight:600;letter-spacing:.2px;
  white-space:nowrap;box-shadow:0 10px 22px -10px rgba(181,115,44,.85),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .12s,filter .15s,box-shadow .15s}
.qc-dl:hover{filter:brightness(1.07);box-shadow:0 14px 26px -10px rgba(181,115,44,.9),inset 0 1px 0 rgba(255,255,255,.3)}
.qc-dl:active{transform:scale(.98)}
.qc-dl.busy{opacity:.6;pointer-events:none}
.qc-picks,.qc-bill{margin-top:22px}
.qc-picks h2,.qc-bill h2{margin:0 0 12px;font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#9A9388;font-weight:500;font-family:var(--display)}
.qc-picks dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 16px}
.qc-picks dl div{min-width:0;padding-bottom:8px;border-bottom:1px solid rgba(185,120,63,.22)}
.qc-picks dt{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#9A9388;margin-bottom:3px}
.qc-picks dd{margin:0;font-size:12px;color:#1B1A18;line-height:1.35;overflow-wrap:anywhere}
.qc-bill ul{list-style:none;margin:0;padding:0}
.qc-bill li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid rgba(185,120,63,.22)}
.qc-bill li span{display:flex;flex-direction:column;gap:2px;min-width:0}
.qc-bill li span i{font-style:normal;font-size:10.5px;color:#8B857B}
.qc-bill li b{font-size:13px;font-weight:600;color:#1B1A18;white-space:nowrap;font-variant-numeric:tabular-nums}
.qc-sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:12px;font-size:12px;color:#6F6A62}
.qc-sum b{font-size:13px;color:#1B1A18;font-variant-numeric:tabular-nums}
.qc-sum.total{margin-top:14px;padding-top:14px;border-top:1.5px solid #1B1A18}
.qc-sum.total span{font-family:var(--display);font-size:15px;color:#1B1A18}
.qc-sum.total b{font-family:var(--display);font-size:23px;color:#B4703A}
.qc-pay{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:24px}
.qc-pay div{border:1px solid #F0DFC6;border-radius:10px;padding:10px 10px 11px;background:#FFF6E8;min-width:0}
.qc-pay div:first-child{background:#FCE9CF;border-color:#E7C69A}
.qc-pay b{display:block;font-family:var(--display);font-size:15px;color:#8A5A2B}
.qc-pay span{display:block;font-size:9.5px;color:#6F6A62;margin:3px 0 6px;line-height:1.3}
.qc-pay i{font-style:normal;font-size:11px;color:#1B1A18;font-variant-numeric:tabular-nums}
.qc-note{margin:16px 0 0;font-size:11px;color:#8E8577;line-height:1.5}
@media (max-width:430px){
  .qcard{padding:24px 20px}
  .qc-pay{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qc-actions{flex-direction:row;align-items:center;justify-content:space-between;width:100%}
  .qc-total{text-align:left}
  .qc-picks dt{font-size:8.5px}
  .qc-picks dd{font-size:11.5px}
}

/* ---------- quote presentation + workings ---------- */
.pres{max-width:900px;margin:34px auto 0;padding:0 2px}
.pres h2{margin:0 0 6px;font-size:22px;letter-spacing:-.4px;color:var(--ink)}
.pres-sub{margin:0 0 18px;font-size:12.5px;color:var(--muted);line-height:1.5}
.pres-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;min-width:0}
.pcard{margin:0;min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:rgba(26,24,22,.6)}
.pcard-hit{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;position:relative}
.pcard-hit img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;transition:transform .35s ease,opacity .2s}
.pcard-hit:hover img{transform:scale(1.04)}
.pcard-hit::after{content:'⤢';position:absolute;top:6px;right:6px;width:20px;height:20px;display:grid;place-items:center;
  font-size:10px;color:#F3F0EA;background:rgba(12,11,10,.62);border:1px solid rgba(255,255,255,.16);border-radius:4px}
.pcard figcaption{padding:7px 8px 9px}
.pcard figcaption span{display:block;font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.pcard figcaption b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;font-weight:500;color:var(--ink);line-height:1.35;overflow-wrap:anywhere}
.calc-h{margin:30px 0 12px;font-size:16px;letter-spacing:-.2px;color:var(--ink);font-family:var(--display);font-weight:500}
.calc-step{border:1px solid var(--line);border-radius:12px;padding:16px 16px 12px;margin-bottom:10px;background:rgba(24,22,20,.72)}
.calc-step h4{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:500}
.calc-step h4 i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);
  font-style:normal;font-size:9.5px;color:var(--accent-d);flex:none}
.calc-ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.calc-ul li{display:grid;grid-template-columns:1fr auto;gap:1px 12px;align-items:baseline;
  padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.05)}
.calc-ul li:last-child{border-bottom:0;padding-bottom:0}
.calc-ul li span{grid-column:1/-1;font-size:12.5px;color:var(--ink2);line-height:1.35}
.calc-ul li i{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.calc-ul li b{font-size:12.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.calc-price li b{color:var(--accent-d)}
.calc-sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:12px;padding-top:10px;
  border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:var(--ink2)}
.calc-sum b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.calc-sum.total{margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.calc-sum.total span{font-family:var(--display);font-size:14px;color:var(--ink)}
.calc-sum.total b{font-family:var(--display);font-size:20px;color:var(--accent-d)}
@media (max-width:520px){
  .pres-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .pcard figcaption b{font-size:10px}
  .calc-step{padding:14px 13px 10px}
}

/* ---------- quote feedback ---------- */
.fb{max-width:900px;margin:30px auto 8px;padding:24px;border:1px solid var(--line);border-radius:16px;
  background:linear-gradient(180deg,rgba(34,31,28,.92),rgba(23,21,19,.96));box-shadow:0 40px 80px -50px #000}
.fb-head h2{margin:0 0 6px;font-size:21px;letter-spacing:-.4px;color:var(--ink)}
.fb-head .hint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.5}
.fb-chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.fbchip{border:1px solid var(--line2);background:rgba(255,255,255,.02);color:var(--ink2);border-radius:999px;
  padding:10px 15px;font-size:12.5px;transition:border-color .15s,background .15s,color .15s,transform .1s}
.fbchip:hover{border-color:var(--accent);color:var(--ink)}
.fbchip:active{transform:scale(.97)}
.fbchip.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.fb-budget{margin:20px 0 0}
.fb-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.fb-row span{font-family:var(--display);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.fb-row b{font-family:var(--display);font-size:17px;color:var(--accent-d)}
#fbRange{width:100%;height:28px;accent-color:var(--accent);cursor:pointer}
.fb-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:-6px}
.fb-scale i{font-style:normal}
.fb-gap{margin:10px 0 0;font-size:12.5px;color:var(--ink2);min-height:18px}
.fb-gap.ok{color:#9EC8AC}
.fb-gap.warn{color:#E8A183}
.fb-acts{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.fb-acts .btn{width:100%}
.fb-acts .linkbtn{align-self:center;font-size:12.5px;color:var(--muted)}
.fb-sent{max-width:900px;margin:22px auto 0;font-size:13px;color:#9EC8AC;text-align:center}
.fb-err{margin:12px 0 0;font-size:12.5px;color:var(--warn)}
.fb-status{margin:16px 0 0;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.fb-status.ok{color:#9EC8AC}


@media print{
  html,body{height:auto;overflow:visible;background:#fff!important}
  .top,.dock,.backdrop,.doc-top,.doc-foot{display:none!important}
  .app{height:auto}
  #stage{padding:0!important;overflow:visible!important}
  .paper{box-shadow:none;padding:0;animation:none}
  .items{font-size:11.5px}
  .items td,.items th{padding:5px 5px}
  .pinfo{padding:14px 0;gap:12px}
  .ptotal{padding:12px 6px}
  .terms{padding:14px 0 4px}
  .pnote{font-size:10.5px;margin-top:10px}
  .items td{animation:none}
  @page{size:A4;margin:14mm}
  .pinfo{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .terms > div{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  .items td,.items th{padding:8px 6px}
  .items th:nth-child(4),.items td:nth-child(4){display:table-cell!important}
  .terms,.ptotal{break-inside:avoid}
}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.done .ring{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--ok);color:var(--ok);display:grid;place-items:center;font-size:28px;animation:rise .5s var(--ease) both}
.done .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.001ms!important}
}

/* ---------- tablet / phone ---------- */
@media (max-width:860px){
  .hero{justify-content:flex-end}
  .hero h1{font-size:clamp(36px,10vw,52px)}
  .backdrop img{object-position:50% 30%}
  .backdrop::after{background:linear-gradient(0deg,rgba(12,11,10,.98) 34%,rgba(12,11,10,.55) 58%,rgba(12,11,10,.05) 82%),linear-gradient(180deg,rgba(12,11,10,.6),transparent 14%)}
  body:not(.start) .backdrop::after{background:linear-gradient(180deg,rgba(10,9,8,.88) 0%,rgba(10,9,8,.74) 55%,rgba(10,9,8,.92) 100%)}
  .hero .lead{font-size:14.5px;margin-top:8px}
  .from{margin:14px 0;padding:10px 0}
  .pinfo{grid-template-columns:1fr 1fr}
  .terms > div{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .head{gap:10px}
  .head-action .btn{padding:9px 12px;font-size:13px}
  .top .in{padding:0 12px;height:58px;gap:10px}
  .brand b{font-size:15px;letter-spacing:2.4px}
  .brand small{display:none}
  .brand svg{width:26px;height:26px}
  .est b{font-size:17px}
  .dock{bottom:calc(12px + env(safe-area-inset-bottom))}
  .dock-menu{width:min(300px,calc(100vw - 32px))}
  .dots{gap:3px}
  .dots i{width:5px}
  .dots i.cur{width:14px}
  body:not(.start) #stage{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  #stage{padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
  .head{margin-bottom:14px}
  h1{font-size:26px}
  .grid{gap:10px;grid-template-columns:repeat(var(--cm),minmax(0,1fr));grid-auto-rows:minmax(0,var(--rhm))}
  .after{margin-top:12px}
  .after .btn{width:100%}
  .meta{padding:24px 10px 8px}
  .nm{font-size:15px}
  .grid:not(.row) .ds{display:none}
  .pr{font-size:12px}
  .gate{padding:28px 20px 22px;border-radius:14px}
  .paper{padding:22px 16px;border-radius:8px}
  .paper-h{flex-direction:column;align-items:flex-start;gap:14px}
  .pmeta{text-align:left}
  .pbrand b{font-size:18px;letter-spacing:3px}
  .pinfo{grid-template-columns:1fr;gap:12px}
  .items{font-size:12.5px}
  .items th:nth-child(4),.items td:nth-child(4){display:none}
  .leads-table th:nth-child(3),.leads-table td:nth-child(3){display:none}
  .leads-table th:nth-child(4),.leads-table td:nth-child(4){display:table-cell}
  .items td,.items th{padding:10px 4px}
  .doc-acts{width:100%}
  .doc-acts .btn{flex:1}
  .sizecard{padding:0 16px 16px}
  .dim{padding:11px 0}
  .dim label{font-size:16px}
  .sizefoot .btn{width:100%}
}
@media (max-height:720px) and (max-width:640px){
  .trust{display:none}
}
@media (max-height:560px){ #stage{overflow:auto} }

/* ============================================================
   LIGHT / MOBILE-FIRST THEME
   Warm cream shell, white cards, dusty-rose accent.
   ============================================================ */
body{
  background:var(--bg);
  background-image:none;
  color:var(--ink);
}
.grid-bg{display:none}
.top{background:rgba(248,241,234,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body.start .top{background:transparent;border-color:transparent}
.brand b{color:var(--ink);letter-spacing:2.6px}
.brand small{color:var(--muted);letter-spacing:1.4px}
.stepno{margin-left:auto;font-size:11.5px;letter-spacing:.6px;color:var(--muted);white-space:nowrap}

/* page heading */
.head h1{font-family:var(--serif);font-weight:600;letter-spacing:-.6px;line-height:1.12;color:var(--ink)}
.hint,.head .hint{color:var(--muted)}
.eyebrow{color:var(--accent-d);letter-spacing:2px}

/* option cards */
.opt{background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px;
  box-shadow:0 10px 24px -22px rgba(58,34,37,.7);transition:border-color .15s,box-shadow .2s,transform .12s}
.opt:hover{box-shadow:0 14px 30px -22px rgba(58,34,37,.85)}
.opt.on{border-color:var(--accent);box-shadow:0 14px 30px -20px rgba(192,133,111,.9)}
.opt-hit{border-radius:14px}
.ph{background:var(--frame);border-radius:14px;overflow:hidden}
.ph img{border-radius:14px}
.meta{padding:11px 8px 8px;position:relative;padding-right:36px}
.nm{color:var(--ink);font-weight:600;font-size:15px}
.meta .ds,.ds{color:var(--muted)}
.pr{color:var(--accent-d);font-weight:600;margin-top:3px}
.detail{color:var(--muted)}
.tick{position:absolute;right:14px;bottom:18px;top:auto;width:26px;height:26px;border-radius:50%;
  background:transparent;border:1.6px solid var(--line2);color:transparent;font-size:12px;
  display:grid;place-items:center}
.opt.on .tick{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.on .nm{color:var(--ink)}
.zoom{background:rgba(255,255,255,.9);color:var(--ink);border:0;box-shadow:0 2px 8px -4px rgba(58,34,37,.5)}

/* segmented + finish cards */
.segbtn{background:#fff;border:1px solid var(--line2);color:var(--ink2);border-radius:999px}
.segbtn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--ink)}
.fcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fcard.on{border-color:var(--accent);box-shadow:0 12px 26px -20px rgba(192,133,111,.9)}
.fimg{border-radius:12px;overflow:hidden;background:var(--frame)}
.fname{color:var(--ink)}
.frate{color:var(--accent-d)}

/* buttons + chips */
.btn{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:999px;font-weight:600}
.btn:hover:not(:disabled){background:var(--accent-d);border-color:var(--accent-d)}
.btn:disabled{background:#fff;color:var(--faint);border-color:var(--line2)}
.btn.line{background:#fff;color:var(--ink);border-color:var(--line2)}
.btn.line:hover:not(:disabled){border-color:var(--ink2);background:#fff}
.chip{background:#fff;border:1px solid var(--line2);color:var(--ink2);border-radius:999px}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.linkbtn{color:var(--accent-d)}

/* dock */
.dock-bar{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:999px;padding:6px;
  box-shadow:0 22px 48px -30px rgba(58,34,37,.55);backdrop-filter:blur(16px) saturate(1.2)}
.dock-btn{background:var(--frame);color:var(--ink);border:1px solid var(--line);width:42px;height:42px;border-radius:50%;font-size:15px}
.dock-btn:hover:not(:disabled){background:#fff}
.dock-cur{color:var(--ink)}
.dock-cur .dots i{background:var(--line2)}
.dock-cur .dots i.done{background:var(--accent)}
.dock-cur .dots i.cur{background:var(--ink)}
.dock-sep{background:var(--line)}
.est span{color:var(--muted);font-size:9px;letter-spacing:1.3px;text-transform:uppercase}
.est b{color:var(--ink);font-family:var(--display);font-size:15px}
.dock-go{flex:none;padding:12px 20px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);
  color:#fff;font-family:var(--display);font-size:14px;letter-spacing:.3px;transition:background .15s,border-color .15s,opacity .15s}
.dock-go:hover:not(:disabled){background:var(--accent-d);border-color:var(--accent-d)}
.dock-go:disabled{background:#fff;color:var(--faint);border-color:var(--line2)}
.dock-menu{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 50px -30px rgba(58,34,37,.6)}
.dock-menu button{color:var(--ink2)}
.dock-menu button:hover{background:var(--frame);color:var(--ink)}
.dock-menu button.cur{background:var(--accent-bg)}
.dock-menu .n{color:var(--muted)}

/* details gate */
.gate{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 70px -50px rgba(58,34,37,.6)}
.gate h1{font-family:var(--serif);color:var(--ink)}
.gate .sub{color:var(--muted)}
.field label{color:var(--ink2)}
.field input{border:1px solid var(--line2);border-radius:12px;background:#fff;color:var(--ink)}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.opt-badge{background:var(--frame);color:var(--muted)}
.fine{color:var(--muted)}

/* quote card */
.qcard{background:#fff;border:1px solid var(--line);box-shadow:0 30px 70px -55px rgba(58,34,37,.6)}
.qc-eyebrow{color:var(--accent-d)}
.qc-sub{color:var(--muted)}
.qc-picks dl div,.qc-bill li{border-color:var(--line)}
.qc-bill li span i{color:var(--muted)}
.qc-sum.total{border-top-color:var(--ink)}
.qc-pay div{background:var(--frame);border-color:var(--line)}
.qc-pay div:first-child{background:#FBEADF;border-color:#EFD3C4}
.qc-dl{background:linear-gradient(180deg,#CB8E76 0%,#B5765F 100%);
  box-shadow:0 10px 22px -12px rgba(181,118,95,.9),inset 0 1px 0 rgba(255,255,255,.35)}
.qc-note{color:var(--muted)}

/* feedback */
.fb{background:#fff;border:1px solid var(--line);box-shadow:0 30px 70px -55px rgba(58,34,37,.6)}
.fb-head h2{font-family:var(--serif);color:var(--ink)}
.fb-head .hint{color:var(--muted)}
.fbchip{background:#fff;border:1px solid var(--line2);color:var(--ink2)}
.fbchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fb-row span{color:var(--muted)}
.fb-gap.ok{color:#567a52}
.fb-gap.warn{color:var(--warn)}
.fb-status{color:var(--muted)}

/* start screen: cream page, photo as a soft hero */
body.start .backdrop img{filter:saturate(1.02) brightness(1.02)}
.backdrop::after{background:linear-gradient(180deg,rgba(248,241,234,0) 0%,rgba(248,241,234,.22) 34%,rgba(248,241,234,.86) 58%,#F8F1EA 70%)}
body:not(.start) .backdrop::after{background:linear-gradient(180deg,rgba(248,241,234,.82) 0%,rgba(248,241,234,.66) 40%,rgba(248,241,234,.9) 100%)}
.hero h1,.start h1{color:var(--ink);font-family:var(--serif);letter-spacing:-1px}
.lead{color:var(--ink2)}
.trust li{color:var(--ink2)}
.trust li::before{color:var(--accent)}

/* one CTA per screen: the dock carries it */
.head .head-action .btn:not(.line){display:none}

/* card image is a banner, not a square: less catalogue chrome, more photo */
.ugrid .ph,.tgrid .ph{aspect-ratio:4/3}
.ugrid .ph img,.tgrid .ph img{object-position:50% 38%}

/* quiz pages sit on plain cream; only Start carries the hero photo */
body:not(.start) .backdrop{opacity:0;visibility:hidden}

/* photo viewer keeps a dark room so images pop */
.photo-view{background:rgba(24,15,16,.94)}
.pv-close{border-color:rgba(255,255,255,.25);color:#fff}


/* --- details gate on the light shell --- */
.gate .field input{background:#fff;border-color:var(--line2);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.gate .field input:focus{border-color:var(--accent);outline:2px solid var(--accent-bg)}
.gate .field input::placeholder{color:var(--faint)}
.gate .btn,.gate .btn.lg{background:var(--accent);border-color:var(--accent);color:#fff}
.gate .btn:hover{background:var(--accent-d);border-color:var(--accent-d)}
.gate .btn:disabled{background:#fff;color:var(--faint);border-color:var(--line2)}
.planbox,.plan,.drop,.dropzone{background:var(--frame) !important;border:1px dashed var(--line2) !important;color:var(--ink2) !important}
.planbox *,.plan *,.drop *,.dropzone *{color:inherit}

/* --- "no photo" tile: light, not a dark block --- */
.ph-none,.ph-none span{
  background:var(--frame);
  color:var(--muted);
  border:1px dashed var(--line2);
  border-radius:12px;
  letter-spacing:1.4px;
  text-transform:uppercase;
  font-size:11px;
}

/* --- soft counters and steppers --- */
.qtybar{background:var(--frame);border-radius:12px}
.qty button{background:#fff;border:1px solid var(--line2);color:var(--ink)}
.qty span{color:var(--ink)}

/* --- compare table --- */
.cmpwrap{background:#fff;border:1px solid var(--line);border-radius:14px}
.cmpwrap th,.cmpwrap td{border-color:var(--line);color:var(--ink2)}
.cmpwrap thead th{color:var(--muted)}

/* --- misc text --- */
.delivery{color:var(--muted)}
.doc-foot{color:var(--muted)}


/* --- floor plan control on the light shell --- */
.upload{background:var(--frame);border:1px dashed var(--line2);color:var(--ink)}
.upload:hover{background:#fff;border-color:var(--accent)}
.upload.has-file{background:#fff;border-style:solid;border-color:var(--line)}
.up-ico{background:var(--accent-bg);color:var(--accent-d)}
.up-meta b{color:var(--ink)}
.up-meta small{color:var(--muted)}
.pdfbadge{background:var(--accent-bg);color:var(--accent-d)}
.upload.has-file img{border-radius:8px}

/* --- skip chips sit quietly above the group --- */
.chip{font-size:12.5px}

/* --- error text --- */
.err{color:var(--warn)}


/* ---------- hand-sketch skin ---------- */
body{
  background:var(--bg);
  background-image:
    radial-gradient(rgba(227,154,172,.06) 1px, transparent 1px),
    radial-gradient(rgba(196,112,138,.04) 1px, transparent 1px);
  background-size:18px 18px, 28px 28px;
  background-position:0 0, 9px 9px;
}
.eyebrow,.qc-eyebrow,.calc-step h4,.pbrand small{letter-spacing:1.6px}
.eyebrow{font-family:var(--hand);font-size:12.5px;letter-spacing:.6px;color:var(--accent-d);text-transform:none}
.head h1{font-family:var(--serif)}
.hint{font-size:14px}
.top{background:rgba(255,248,247,.9);border-bottom:1px solid var(--line)}
.stepno{font-family:var(--hand);font-size:13px;letter-spacing:.3px;color:var(--accent-d)}
.opt{background:var(--white);border:1px solid var(--line2);box-shadow:0 10px 22px -20px rgba(196,112,138,.55)}
.opt.on{border-color:var(--accent);box-shadow:0 14px 26px -18px rgba(227,154,172,.9)}
.ph{background:var(--frame)}
.tick{border-color:var(--line2)}
.opt.on .tick{background:var(--accent);border-color:var(--accent);color:#fff}
.pr{color:var(--accent-d)}
.btn{background:var(--accent);border-color:var(--accent);color:#4A3B42}
.btn:hover:not(:disabled){background:var(--accent-d);border-color:var(--accent-d);color:#fff}
.dock-bar{background:rgba(255,255,255,.96);border-color:var(--line2);box-shadow:0 22px 44px -30px rgba(196,112,138,.55)}
.dock-go{background:var(--accent);border-color:var(--accent);color:#4A3B42}
.dock-go:hover:not(:disabled){background:var(--accent-d);border-color:var(--accent-d);color:#fff}
.dock-go:disabled{background:#fff;color:var(--faint);border-color:var(--line2)}
.dock-btn{background:var(--frame);border-color:var(--line2);color:var(--ink)}
.segbtn{border-color:var(--line2)}
.segbtn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--ink)}
.chip{border-color:var(--line2);color:var(--ink2)}
.qcard{background:var(--paper);border-color:var(--line2)}
.qc-dl{background:linear-gradient(180deg,#EDA9BA 0%,#D9839B 100%);color:#fff;
  box-shadow:0 10px 20px -12px rgba(196,112,138,.9),inset 0 1px 0 rgba(255,255,255,.5)}
.qc-pay div{background:var(--frame);border-color:var(--line2)}
.qc-pay div:first-child{background:#FCE4EA;border-color:#F2C9D3}
.qc-pay b{color:var(--accent-d)}
.qc-pay i{color:var(--ink)}
.fb{background:var(--white);border-color:var(--line2)}
.fbchip.on{background:var(--accent);border-color:var(--accent);color:#4A3B42}
.gate{background:var(--paper);border-color:var(--line2)}
.gate .field input{background:#fff;border-color:var(--line2)}
.gate .btn{background:var(--accent);border-color:var(--accent);color:#4A3B42}
.upload{background:var(--frame);border-color:var(--line2)}
.up-ico{background:var(--accent-bg);color:var(--accent-d)}
.pdfbadge{background:var(--accent-bg);color:var(--accent-d)}
.cmpwrap{background:var(--white);border-color:var(--line2)}
.ph-none{background:var(--frame);color:var(--muted);border-color:var(--line2)}


/* counted steps (drawers) as a clean list on the light shell */
.grid.row .opt{display:grid;grid-template-columns:92px 1fr;grid-template-areas:"ph meta" "ph qty";
  gap:6px 14px;align-items:center;padding:10px;position:relative}
.grid.row .opt-hit{display:contents}
.grid.row .ph{grid-area:ph;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--frame)}
.grid.row .ph img{width:100%;height:100%;object-fit:cover}
.grid.row .meta{grid-area:meta;position:static;left:auto;right:auto;bottom:auto;background:none;
  padding:0 34px 0 0;gap:2px;z-index:auto}
.grid.row .nm{text-shadow:none;color:var(--ink);font-size:15px}
.grid.row .nm em{background:var(--accent-bg);color:var(--accent-d)}
.grid.row .ds{opacity:1;color:var(--muted);white-space:normal;line-height:1.35}
.grid.row .detail{display:none}
.grid.row .tick{top:12px;right:12px;bottom:auto}
.grid.row .qtybar{grid-area:qty;margin:0;padding:0;background:transparent;border:0}
.grid.row .qtybar .qlabel{font-size:10px;letter-spacing:1.2px;color:var(--muted)}
.grid.row .qty{border:1px solid var(--line2);border-radius:999px;background:#fff}


/* ---------- inline editor sheet ---------- */
.qc-picks dl div{display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:center;position:relative;padding-right:0}
.qc-picks dt{grid-column:1/-1}
.qc-picks dd{grid-column:1;min-width:0}
.qc-edit{grid-column:2;align-self:center;border:1px solid var(--line2);background:#fff;color:var(--accent-d);

.qc-edit:hover{border-color:var(--accent);background:var(--accent-bg)}

.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(58,47,53,0);transition:background .2s}
.sheet.in{background:rgba(58,47,53,.34)}
.sheet-panel{width:100%;max-width:520px;max-height:82vh;display:flex;flex-direction:column;background:var(--paper);
  border-radius:22px 22px 0 0;box-shadow:0 -24px 60px -30px rgba(58,47,53,.55);transform:translateY(14px);opacity:.6}
.sheet.in .sheet-panel{transform:none;opacity:1;transition:transform .22s var(--ease),opacity .22s}
.sheet-panel header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;border-bottom:1px solid var(--line)}
.sheet-panel header b{font-family:var(--serif);font-size:20px;color:var(--ink)}
.sheet-x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:#fff;color:var(--ink2)}
.sheet-list{overflow:auto;padding:12px 16px 6px;display:grid;gap:8px}
.sheet-grid{display:grid;grid-template-columns:1fr;gap:8px}
.sheet-grid.round{grid-template-columns:repeat(2,minmax(0,1fr))}
.sheet-opt{display:grid;grid-template-columns:1fr auto 22px;align-items:center;gap:10px;width:100%;
  padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:#fff;text-align:left}
.sheet-opt.on{border-color:var(--accent);background:var(--accent-bg)}
.so-name{font-size:13.5px;color:var(--ink);font-weight:500}
.so-price{font-size:12px;color:var(--accent-d);font-variant-numeric:tabular-nums;white-space:nowrap}
.so-tick{width:20px;height:20px;border-radius:50%;border:1.4px solid var(--line2);display:grid;place-items:center;font-size:11px;color:transparent}
.sheet-opt.on .so-tick{background:var(--accent);border-color:var(--accent);color:#fff}
.sheet-sub{padding:10px 2px 2px;display:flex;align-items:center;gap:10px}
.ss-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.sheet-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:12px 14px;
  border:1px solid var(--line2);border-radius:14px;background:#fff}
.sheet-row.on{border-color:var(--accent);background:var(--accent-bg)}
.sr-name{display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--ink);font-weight:500}
.sr-name i{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:400}
.sr-price{font-size:12px;color:var(--accent-d)}
.sheet-row .qty{display:flex;align-items:center;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:#fff}
.sheet-row .qty button{width:34px;height:32px;border:0;background:#fff;color:var(--ink);font-size:16px}
.sheet-row .qty b{min-width:26px;text-align:center;font-size:13px;color:var(--ink)}
.sheet-panel footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px 18px;border-top:1px solid var(--line)}
#sheetTotal{font-family:var(--display);font-size:15px;color:var(--ink)}
body.sheet-open{overflow:hidden}
@media (min-width:640px){ .sheet{align-items:center} .sheet-panel{border-radius:20px} }


/* size page hero */
.size-hero{margin:2px 0 14px;border-radius:16px;overflow:hidden;border:1px solid var(--line);
  background:var(--paper);box-shadow:0 16px 34px -30px rgba(196,112,138,.7)}
.size-hero img{display:block;width:100%;height:auto}
.size-hero figcaption{padding:9px 14px 11px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);
  background:var(--frame)}
@media (max-width:430px){ .size-hero{border-radius:14px} .size-hero figcaption{font-size:11px;padding:8px 12px} }


/* layout cards follow the shape sheet: wide 16:9 frames */
.tgrid.w16 .fimg{aspect-ratio:7/4;background:var(--paper)}
.tgrid.w16 .fimg img{object-fit:cover;padding:0}
.tgrid.w16 .fcard{border-radius:16px}
.tgrid.w16 .zoom{left:8px;right:auto;top:auto;bottom:8px}


/* glass add-on thumbnail */
.aico-img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line2)}

/* rate, not a computed total, on the glass row */
.addon .aamt small{font-size:10px;letter-spacing:.2px;opacity:.75;margin-left:2px;font-weight:500}


/* "already existing" reads as a skip, not a missing photo */
.ph-skip{display:grid;place-content:center;justify-items:center;gap:6px;width:100%;height:100%;min-height:120px;
  padding:14px;text-align:center;background:var(--frame);border:1.5px dashed var(--line2);border-radius:12px}
.ph-skip b{font-family:var(--serif);font-size:22px;color:var(--accent-d);letter-spacing:-.2px}
.ph-skip i{font-style:normal;font-size:11.5px;color:var(--muted);line-height:1.35;max-width:16ch}
.fcard.on .ph-skip{border-color:var(--accent);background:var(--accent-bg)}

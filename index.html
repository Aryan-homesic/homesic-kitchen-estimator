<script>
/* ============================================================
   RATE CARD — placeholder values for the final spec.
   Replace every number here with the studio's confirmed rates.
   Board / finish / counter / backsplash are per sq ft.
   Handles and hinges are per piece. Lighting is per running ft.
   ============================================================ */
const CONFIG = {
  // ---------------------------------------------------------------
  // LEADS - the two values the studio must set
  // ---------------------------------------------------------------
  // 1. Paste your own Web3Forms access key here (free at web3forms.com,
  //    sign in with the studio email and copy the key). Every quote is
  //    emailed to the address that key belongs to.
  leadAccessKey: 'd411e48a-e577-490c-993e-819d53082e91',
  // 2. Studio WhatsApp number, digits with country code, e.g. 919876543210.
  //    Used by "Share on WhatsApp" and as the fallback when email fails.
  whatsapp: '',
  // Endpoint - leave as is for Web3Forms. Formspree also works:
  // https://formspree.io/f/your-form-id
  leadEndpoint: 'https://api.web3forms.com/submit',
  leadCompany: 'Homesic',
  // Calendly-style site-visit link; empty hides the button.
  calendly: ''
};
const RATES = {
  // Woodwork is one combined rate per sq ft of carcass: board x finish.
  woodwork: {
    hdhmr: { laminate: 1450, acrylic: 1600, membrane: 2500, pu: 2600, veneer: 2600, rattan: 3000 },
    bwr:   { laminate: 1800, acrylic: 2000, membrane: 2700, pu: 2900, veneer: 2900, rattan: 3200 },
    bwp:   { laminate: 1900, acrylic: 2100, membrane: 2800, pu: 2800, veneer: 3200, rattan: 3200 }
  },
  glass: 2100,                                                // per sq ft, profile shutters
  handle:     { profile: 250, standard: 100, premium: 250, designer: 500, groove: 0 }, // per door
  counter:    { granite: 700, quartz: 1100, install: 300, existing: 0 }, // per sq ft
  backsplash: { tiles: 200, existing: 0 },    // per sq ft
  // Sink is a material x type price, quoted per unit (like board x finish).
  sinkType: { single: 7200, double: 15600, doubletray: 21600, tray: 12000 },  // per set, whatever the material
  pvc:        { leg: 50, skirting: 3000 },                    // per leg / per strip
  faucet:     { standard: 1000, premium: 2000, designer: 4000 }, // per faucet
  // Hinge price depends on the function only; the brand is a preference, not a price.
  hingeFn:    { soft: 300, push: 600 },       // per hinge
  drawers:    { normal: 2000, jali: 3000, tandem: 4000 },     // per drawer
  lighting:   { standard: 10000, premium: 20000, elite: 30000 }, // per project
  accessoryRemoved: true
};
const DESIGN_PCT = 0.05;
const DOOR_WIDTH = 2;        // ft
const FRIDGE_GAP = 2;        // ft
const LOFT_OFFSET = 7;       // ft
const TALL_CARCASS = 4;      // sq ft, fixed
const COUNTER_DEPTH = 2;     // ft
const SPLASH_HEIGHT = 2;     // ft
const FAUCET_COUNT = 1;
const TERMS = [['Token amount', .10], ['Production', .40], ['Before shutters & hardware', .45], ['After handover', .05]];

/* One-tap reactions + budget lever shown under the quote. */
const FEEDBACK = [
  { id:'expected',  label:'Exactly what I expected' },
  { id:'value',     label:'Good value' },
  { id:'above',     label:'Slightly over budget' },
  { id:'expensive', label:'Too expensive' },
  { id:'choices',   label:'Change some choices' },
  { id:'help',      label:'Need help deciding' }
];
const BUDGET_MIN = 200000, BUDGET_MAX = 600000, BUDGET_STEP = 25000;
const lakh = n => '₹' + (n / 100000).toFixed(n % 100000 === 0 ? 0 : 1) + ' L';

const A = 'assets/';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const byId = (list, id) => list.find(o => o.id === id) || null;
const round1 = n => Math.round(n * 10) / 10;
const stage = $('stage');

function openPhoto(img, name){
  const v = $('photoView');
  if(!v || !img) return;
  $('pvImg').src = A + img;
  $('pvImg').alt = name || '';
  $('pvCap').textContent = name || '';
  v.hidden = false;
}
function closePhoto(){ const v = $('photoView'); if(v) v.hidden = true; }

/* ============================================================
   CATALOGS
   ============================================================ */
const LAYOUTS = [
  { id:'straight', name:'Straight', img:'shape/straight.jpg', fit:1,
    gross:(l,b)=>l, base:(l,b)=>l, wall:(l,b)=>l },
  { id:'parallel', name:'Parallel', img:'shape/parallel.jpg', fit:1,
    gross:(l,b)=>2*l, base:(l,b)=>2*l, wall:(l,b)=>2*l },
  { id:'lshape', name:'L-shape', img:'shape/lshape.jpg', fit:1, tag:'Popular',
    gross:(l,b)=>l+b, base:(l,b)=>l+b-2, wall:(l,b)=>l+b-1.5 },
  { id:'ushape', name:'U-shape', img:'shape/ushape.jpg', fit:1,
    gross:(l,b)=>2*l+b, base:(l,b)=>2*l+b-4, wall:(l,b)=>2*l+b-3 }
];
const UNITS = [
  { id:'base',   name:'Base',       ds:'Counter-height carcass', img:'storage/unit-base.jpg' },
  { id:'wall',   name:'Wall',       ds:'Upper carcass', img:'storage/unit-wall.jpg' },
  { id:'loft',   name:'Loft',       ds:'Above the wall units', img:'storage/unit-loft.jpg' },
  { id:'tall',   name:'Tall',       ds:'Fixed 4 sq ft carcass', img:'storage/unit-tall.jpg' },
  { id:'fridge', name:'Fridge', ds:'2 ft gap in base, wall, splash', img:'storage/unit-fridge.jpg' }
];
const BOARDS = [
  { id:'bwp',   name:'BWP ply', ds:'Waterproof marine plywood', img:'board-bwp-marine-plywood.jpg' },
  { id:'hdhmr', name:'HDHMR',   ds:'Dense, moisture resistant', img:'board-hdhmr-board.jpg', tag:'Popular' },
  { id:'bwr',   name:'BWR ply', ds:'Water-resistant plywood', img:'board-bwr-plywood.jpg' }
];
const FINISHES = [
  { id:'laminate', name:'Laminate', ds:'0.8 / 1 mm', img:'finishes/laminate.jpg', tag:'Popular' },
  { id:'acrylic',  name:'Acrylic',  ds:'High gloss', img:'finishes/acrylic.jpg' },
  { id:'membrane', name:'Membrane', ds:'Soft matte', img:'finishes/membrane.jpg' },
  { id:'pu',       name:'PU',       ds:'Painted lacquer', img:'finishes/pu.jpg' },
  { id:'veneer',   name:'Veneer',   ds:'Natural grain', img:'finishes/veneer.jpg' },
  { id:'rattan',   name:'Rattan',   ds:'Woven texture', img:'finishes/rattan.jpg' }
];
const HANDLES = [
  { id:'profile',  name:'Profile',  ds:'G-profile aluminium channel', img:'handles/profile.jpg', tag:'Popular' },
  { id:'standard', name:'Standard', ds:'Everyday pull handle', img:'handles/bar.jpg' },
  { id:'premium',  name:'Premium',  ds:'Longer, heavier pull', img:'handles/groove.jpg' },
  { id:'designer', name:'Designer', ds:'Statement handle', img:'handles/knob.jpg' },
  { id:'groove',   name:'Groove',   ds:'Recessed finger pull, included', img:'handles/profile.jpg' }
];
const COUNTERS = [
  { id:'granite',  name:'Granite',           ds:'Natural stone', img:'card-counter-granite.jpg', tag:'Popular' },
  { id:'quartz',   name:'Quartz',            ds:'Non-porous', img:'card-counter-quartz.jpg' },
  { id:'install',  name:'Only installation', ds:'You supply the slab, we fit it', img:'card-counter-install.jpg' }
];
const BACKSPLASH = [
  { id:'tiles',    name:'Tiles',            ds:'Glazed tile splashback', img:'backsplash-tiles.jpg', tag:'Popular' }
];
const SINK_MATERIALS = [
  { id:'ss',      name:'Stainless steel', ds:'Hygienic and easy to clean', img:'sinks/material-ss.jpg', tag:'Popular' },
  { id:'granite', name:'Granite',         ds:'Deep composite bowls', img:'sinks/material-granite.jpg' },
  { id:'quartz',  name:'Quartz',          ds:'Stain-resistant composite', img:'sinks/material-quartz.jpg' },
  { id:'ceramic', name:'Ceramic',         ds:'Glazed fireclay', img:'sinks/material-ceramic.jpg' }
];
const SINK_TYPES = [
  { id:'single',     name:'Single bowl',            ds:'One deep bowl',              img:'sinks/type-single.jpg', tag:'Popular' },
  { id:'double',     name:'Double bowl',            ds:'Two bowls side by side',     img:'sinks/type-double.jpg' },
  { id:'doubletray', name:'Double with drainboard', ds:'Two bowls, board & colander', img:'sinks/type-tray.jpg' },
  { id:'tray',       name:'Worktop sink',           ds:'Bowl with a draining board', img:'sinks/type-doubletray.jpg' }
];
const FAUCETS = [
  { id:'standard', name:'Standard', ds:'Everyday wall-mounted tap', img:'faucets/wall.jpg', tag:'Popular' },
  { id:'premium',  name:'Premium',  ds:'Two-handle, brass body', img:'faucets/double.jpg' },
  { id:'designer', name:'Designer', ds:'Single lever, pull-down spout', img:'faucets/single.jpg' }
];
const HINGE_BRANDS = [
  { id:'hettich', name:'Hettich', ds:'German-engineered precision', img:'hardware-hettich.jpg', tag:'Popular' },
  { id:'moda',    name:'Moda',    ds:'Soft-close hinge' },
  { id:'doorset', name:'Doorset', ds:'Value hardware, widely stocked' }
];
const HINGE_FUNCTIONS = [
  { id:'soft', name:'Soft-close',   ds:'No slamming', img:'hardware-soft-close.jpg', tag:'Popular' },
  { id:'push', name:'Push-to-open', ds:'Handle-free fronts', img:'hardware-push-open.jpg' }
];
const LIGHTING = [
  { id:'standard', name:'Standard', ds:'Internal lighting only', img:'lighting-internal.jpg', tag:'Popular' },
  { id:'premium',  name:'Premium',  ds:'Internal + external + outlets', img:'lighting-internal-external-outlets.jpg' },
  { id:'elite',    name:'Elite',    ds:'Complete lighting + concealed outlets', img:'lighting-complete.jpg' }
];
const DRAWERS = [
  { id:'normal', name:'Normal channel',        ds:'Drawer box on standard channels', img:'storage/unit-base.jpg' },
  { id:'jali',   name:'Jali + channels',       ds:'Wire-basket drawer on channels', img:'storage/unit-wall.jpg' },
  { id:'tandem', name:'Innotech tandem',       ds:'Soft-close tandem runners', img:'storage/unit-tall.jpg', tag:'Popular' }
];


/* ============================================================
   STATE
   ============================================================ */
const STORE = 'homesic.v1';
const LEADS = 'homesic.leads.v1';
const DEFAULTS = {
  units: { base:true, wall:true, loft:true, tall:false, fridge:false },
  board:'hdhmr', finish:'laminate', handle:'profile', counter:'granite',
  backsplash:'tiles', sinkMaterial:'ss', sinkType:'single',
  faucet:'standard', hingeBrand:'hettich', hingeFunction:'soft', lighting:'standard'
};
const fresh = () => ({
  step: 0, layout:'', l:'', b:'', h:'9',
  units: { ...DEFAULTS.units },
  board:'', finish:'', handle:'', counter:'', backsplash:'',
  sinkMaterial:'', sinkType:'', faucet:'',
  hingeBrand:'', hingeFunction:'', lighting:'',
  drawers: { normal:0, jali:0, tandem:0 },
  skip: { counter:false, backsplash:false, sink:false, faucet:false, lighting:false },
  glass: false,
  fb: { tags: [], budget: null, touched: false },
  name:'', phone:'', email:'', city:'', plan:null, lead:null
});
let state = fresh();
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  if(saved) Object.assign(state, saved);
} catch(e) {}
state.units = Object.assign({ ...DEFAULTS.units }, state.units || {});
state.drawers = Object.assign({ normal:0, jali:0, tandem:0 }, state.drawers || {});
state.skip = Object.assign({ counter:false, backsplash:false, sink:false, faucet:false, lighting:false }, state.skip || {});
state.glass = state.glass === true;
state.fb = Object.assign({ tags: [], budget: null, touched: false }, state.fb || {});
if(!Array.isArray(state.fb.tags)) state.fb.tags = [];
if(typeof state.email !== 'string') state.email = '';
if(state.lead && state.lead.delivery === 'sending') state.lead.delivery = 'local';
if(!(Number(state.h) > 0)) state.h = '9';
state.planError = '';
let planUrl = '';

// Sanitise ids saved by an older version of the calculator.
const valid = (list, id) => !!byId(list, id);
if(state.layout && !valid(LAYOUTS, state.layout)) state.layout = '';
[['board',BOARDS],['finish',FINISHES],['handle',HANDLES],['counter',COUNTERS],
 ['backsplash',BACKSPLASH],['sinkMaterial',SINK_MATERIALS],['sinkType',SINK_TYPES],
 ['faucet',FAUCETS],['hingeBrand',HINGE_BRANDS],['hingeFunction',HINGE_FUNCTIONS],
 ['lighting',LIGHTING]].forEach(([k,list]) => {
  if(state[k] && !valid(list, state[k])) state[k] = '';
});

const save = () => { try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} };

/* ============================================================
   LEADS (localStorage)
   ============================================================ */
function getLeads(){
  try{ const a = JSON.parse(localStorage.getItem(LEADS)); return Array.isArray(a) ? a : []; }catch(e){ return []; }
}
function saveLead(record){
  const list = getLeads();
  list.unshift(record);
  try{ localStorage.setItem(LEADS, JSON.stringify(list.slice(0, 100))); }catch(e){}
}

/* ============================================================
   CALCULATOR
   ============================================================ */
const ROOM = { l:10, b:8, h:9 };
const dimsOf = (s = state) => ({ l:Number(s.l) || 0, b:Number(s.b) || 0, h:Number(s.h) || 0 });
const hasSize = (s = state) => dimsOf(s).l > 0 && dimsOf(s).b > 0;
const unitsOf = (s = state) => s.units || DEFAULTS.units;

function runFor(layoutId, s = state){
  const d = hasSize(s) ? dimsOf(s) : { l:ROOM.l, b:ROOM.b, h:Number(s.h) || ROOM.h };
  const layout = byId(LAYOUTS, layoutId) || byId(LAYOUTS, 'lshape');
  const u = unitsOf(s);
  const gross = Math.max(0, layout.gross(d.l, d.b));
  let base = Math.max(0, layout.base(d.l, d.b));
  let wall = Math.max(0, layout.wall(d.l, d.b));
  let grossBase = gross;
  if(u.fridge){
    base = Math.max(0, base - FRIDGE_GAP);
    wall = Math.max(0, wall - FRIDGE_GAP);
    grossBase = Math.max(0, grossBase - FRIDGE_GAP);
  }
  return { gross, base, wall, loft: Math.max(0, layout.wall(d.l, d.b)), grossBase, height:d.h, fridge:!!u.fridge };
}
function runInfo(s = state){ return runFor(s.layout || 'lshape', s); }

function buildSpec(s = state){
  const board = byId(BOARDS, s.board || DEFAULTS.board) || BOARDS[0];
  const finish = byId(FINISHES, s.finish || DEFAULTS.finish) || byId(FINISHES, DEFAULTS.finish);
  return { board, finish, rate: RATES.woodwork[board.id][finish.id] };
}
function price(s = state){
  const pick = k => s[k] || DEFAULTS[k];
  const info = runInfo(s);
  const u = unitsOf(s);
  const baseOn = !!u.base, wallOn = !!u.wall, loftOn = !!u.loft, tallOn = !!u.tall;
  const spec    = buildSpec(s);
  const handle  = byId(HANDLES, pick('handle')) || byId(HANDLES, DEFAULTS.handle);
  const counter = byId(COUNTERS, pick('counter')) || byId(COUNTERS, DEFAULTS.counter);
  const splash  = byId(BACKSPLASH, pick('backsplash')) || byId(BACKSPLASH, DEFAULTS.backsplash);
  const sinkMat = byId(SINK_MATERIALS, pick('sinkMaterial')) || byId(SINK_MATERIALS, DEFAULTS.sinkMaterial);
  const sinkT   = byId(SINK_TYPES, pick('sinkType')) || byId(SINK_TYPES, DEFAULTS.sinkType);
  const faucet  = byId(FAUCETS, pick('faucet')) || byId(FAUCETS, DEFAULTS.faucet);
  const hBrand  = byId(HINGE_BRANDS, pick('hingeBrand')) || byId(HINGE_BRANDS, DEFAULTS.hingeBrand);
  const hFn     = byId(HINGE_FUNCTIONS, pick('hingeFunction')) || byId(HINGE_FUNCTIONS, DEFAULTS.hingeFunction);
  const light   = byId(LIGHTING, pick('lighting')) || byId(LIGHTING, DEFAULTS.lighting);

  const loftH = Math.max(0, info.height - LOFT_OFFSET);
  const carcass = {
    base: baseOn ? info.base * 3 : 0,
    wall: wallOn ? info.wall * 2 : 0,
    loft: loftOn ? info.loft * loftH : 0,
    tall: tallOn ? TALL_CARCASS : 0
  };
  carcass.total = carcass.base + carcass.wall + carcass.loft + carcass.tall;

  const doors = {
    base: baseOn ? Math.ceil(info.base / DOOR_WIDTH) : 0,
    wall: wallOn ? Math.ceil(info.wall / DOOR_WIDTH) : 0,
    loft: loftOn ? Math.ceil(info.loft / DOOR_WIDTH) : 0,
    tall: 0
  };
  doors.total = doors.base + doors.wall + doors.loft + doors.tall;
  const handles = doors.total;
  const hinges = handles * 2;

  const skip = s.skip || {};
  const wallArea = wallOn ? info.wall * 2 : 0;
  const glassOn = !!s.glass && wallOn;
  const CP = Math.round(carcass.total * spec.rate);
  const HP  = Math.round(handles * RATES.handle[handle.id]);
  const CTP = (baseOn && !skip.counter) ? Math.round(info.base * COUNTER_DEPTH * RATES.counter[counter.id]) : 0;
  const BSP = skip.backsplash ? 0 : Math.round(info.grossBase * SPLASH_HEIGHT * RATES.backsplash[splash.id]);
  const sinkRate = RATES.sinkType[sinkT.id];
  const sinkAmt = skip.sink ? 0 : sinkRate;
  const faucetAmt = skip.faucet ? 0 : RATES.faucet[faucet.id] * FAUCET_COUNT;
  const SP  = Math.round(sinkAmt + faucetAmt);
  const HiP = Math.round(hinges * RATES.hingeFn[hFn.id]);
  const LP  = skip.lighting ? 0 : Math.round(RATES.lighting[light.id]);
  const dwr = s.drawers || {};
  let DP = 0;
  const dwrItems = [];
  DRAWERS.forEach(d => {
    const q = Math.max(0, Math.round(Number(dwr[d.id]) || 0));
    if(q > 0){
      const amount = q * RATES.drawers[d.id];
      DP += amount;
      dwrItems.push({ d, q, amount });
    }
  });
  DP = Math.round(DP);

  // Glass profile shutters replace the finish on the wall units.
  const glassArea = glassOn ? wallArea : 0;
  const GL = glassOn ? Math.round(wallArea * RATES.glass) : 0;

  // PVC legs (4 per 2 ft of base) and one skirting strip per 10 ft of base.
  const legs = baseOn ? Math.ceil(info.base / 2) * 4 : 0;
  const skirt = baseOn ? Math.ceil(info.base / 10) : 0;
  const PVCP = Math.round(legs * RATES.pvc.leg + skirt * RATES.pvc.skirting);

  const construction = CP + GL + PVCP + HP + CTP + BSP + SP + HiP + LP + DP;
  const design = Math.round(construction * DESIGN_PCT);
  const total = construction + design;

  const lines = [];
  const add = (d, q, u, r, a) => { if(a > 0) lines.push({ d, q: round1(q), u, r: Math.round(r), a }); };
  add('18 mm ' + spec.board.name + ' with ' + spec.finish.name + ' finish', carcass.total, 'sq ft', spec.rate, CP);
  if(GL > 0) add('Glass profile shutters · wall units', glassArea, 'sq ft', RATES.glass, GL);
  if(PVCP > 0) add('PVC legs (' + legs + ') + skirting (' + skirt + ' strip' + (skirt === 1 ? '' : 's') + ')', 1, 'set', PVCP, PVCP);
  add(handle.name + ' handles', handles, 'nos', RATES.handle[handle.id], HP);
  if(!skip.counter) add(counter.name + ' countertop', info.base * COUNTER_DEPTH, 'sq ft', RATES.counter[counter.id], CTP);
  if(!skip.backsplash) add(splash.name + ' backsplash', info.grossBase * SPLASH_HEIGHT, 'sq ft', RATES.backsplash[splash.id], BSP);
  if(!skip.sink) add('Sink · ' + sinkMat.name + ' · ' + sinkT.name, 1, 'set', sinkRate, Math.round(sinkRate));
  if(!skip.faucet) add(faucet.name, FAUCET_COUNT, 'nos', RATES.faucet[faucet.id], Math.round(RATES.faucet[faucet.id] * FAUCET_COUNT));
  add('Hinges · ' + hBrand.name + ' ' + hFn.name, hinges, 'nos', RATES.hingeFn[hFn.id], HiP);
  if(!skip.lighting) add(light.name + ' lighting', 1, 'project', RATES.lighting[light.id], LP);
  dwrItems.forEach(({ d, q, amount }) => add(d.name + ' drawers', q, 'nos', RATES.drawers[d.id], amount));
  add('Design charge (' + Math.round(DESIGN_PCT * 100) + '%)', 1, '', design, design);

  return {
    run: info, carcass, doors, handles, hinges,
    board: spec.board, finish: spec.finish, woodRate: spec.rate, glassOn: !!(s.glass && wallOn), glass: GL, glassArea,
    handle, counter, splash, sinkMat, sinkT, faucet, hBrand, hFn, light,
    lines, construction, design, total,
    breakdown: { CP, GL, PVCP, HP, CTP, BSP, SP, HiP, LP, DP },
    assumed: !hasSize(s)
  };
}

function unitPrice(id, s = state){
  const p = price(s);
  if(id === 'fridge'){
    const off = JSON.parse(JSON.stringify(s)); off.units = { ...unitsOf(s), fridge:false };
    const on = JSON.parse(JSON.stringify(s)); on.units = { ...unitsOf(s), fridge:true };
    return (price(on).construction - price(off).construction) * (1 + DESIGN_PCT);
  }
  const mat = p.woodRate;
  const door = RATES.handle[p.handle.id] + 2 * RATES.hingeFn[p.hFn.id];
  let area = 0, doors = 0;
  if(id === 'base'){ area = p.run.base * 3; doors = Math.ceil(p.run.base / DOOR_WIDTH); }
  if(id === 'wall'){ area = p.run.wall * 2; doors = Math.ceil(p.run.wall / DOOR_WIDTH); }
  if(id === 'loft'){ area = p.run.loft * Math.max(0, p.run.height - LOFT_OFFSET); doors = Math.ceil(p.run.loft / DOOR_WIDTH); }
  if(id === 'tall'){ area = TALL_CARCASS; doors = 0; }
  return (area * mat + doors * door) * (1 + DESIGN_PCT);
}
function optLabel(step, o){
  const p = price();
  const brand = byId(HINGE_BRANDS, state.hingeBrand || DEFAULTS.hingeBrand);
  const fn = byId(HINGE_FUNCTIONS, state.hingeFunction || DEFAULTS.hingeFunction);
  switch(step.id){
    case 'layout': {
      const r = runFor(o.id);
      return '≈ ' + round1(r.base) + ' ft base · ' + round1(r.wall) + ' ft wall';
    }
    case 'units': {
      const r = p.run, up = unitPrice(o.id);
      if(o.id === 'fridge') return up < 0 ? 'Saves ' + inr(-up) : 'No saving';
      if(o.id === 'base') return '≈ ' + inr(up) + ' · ' + round1(r.base) + ' ft run';
      if(o.id === 'wall') return '≈ ' + inr(up) + ' · ' + round1(r.wall) + ' ft run';
      if(o.id === 'loft') return '≈ ' + inr(up) + ' · ' + round1(r.loft) + ' ft run';
      return '≈ ' + inr(up) + ' · 4 sq ft';
    }
    case 'board': return inr(RATES.woodwork[o.id].laminate) + ' / sq ft';
    case 'handle': return RATES.handle[o.id] ? inr(RATES.handle[o.id]) + ' each' : 'Included';
    case 'counter': return RATES.counter[o.id] ? inr(RATES.counter[o.id]) + ' / sq ft' : 'Skip';
    case 'backsplash': return RATES.backsplash[o.id] ? inr(RATES.backsplash[o.id]) + ' / sq ft' : 'Skip';
    case 'sinkMaterial': return '';
    case 'sinkType': return inr(RATES.sinkType[o.id]);
    case 'faucet': return inr(RATES.faucet[o.id]);
    case 'hingeBrand': return inr(RATES.hingeFn[fn.id]) + ' / hinge';
    case 'hingeFunction': return inr(RATES.hingeFn[o.id]) + ' / hinge';
    case 'lighting': return inr(RATES.lighting[o.id]) + ' / project';
    case 'drawers': return inr(RATES.drawers[o.id]) + ' each';
  }
  return '';
}
function detailLines(step, o){
  const p = price(), r = p.run;
  const brand = byId(HINGE_BRANDS, state.hingeBrand || DEFAULTS.hingeBrand);
  const fn = byId(HINGE_FUNCTIONS, state.hingeFunction || DEFAULTS.hingeFunction);
  switch(step.id){
    case 'layout': {
      const rr = runFor(o.id);
      return ['Gross ' + round1(rr.gross) + ' ft · base ' + round1(rr.base) + ' ft', 'Wall / loft ' + round1(rr.wall) + ' ft' + (rr.fridge ? ' · fridge gap applied' : '')];
    }
    case 'units': {
      const up = unitPrice(o.id);
      if(o.id === 'base') return ['≈ ' + inr(up) + ' incl. design', 'Base run ' + round1(r.base) + ' ft · carcass ' + round1(p.carcass.base) + ' sq ft', p.doors.base + ' doors · countertop separate'];
      if(o.id === 'wall') return ['≈ ' + inr(up) + ' incl. design', 'Wall run ' + round1(r.wall) + ' ft · carcass ' + round1(p.carcass.wall) + ' sq ft', p.doors.wall + ' doors'];
      if(o.id === 'loft') return ['≈ ' + inr(up) + ' incl. design', 'Loft run ' + round1(r.loft) + ' ft · ' + round1(Math.max(0, r.height - LOFT_OFFSET)) + ' ft high', p.doors.loft + ' doors'];
      if(o.id === 'tall') return ['≈ ' + inr(up) + ' incl. design', 'Fixed 4 sq ft carcass', 'No doors or handles'];
      return ['Saves ' + inr(Math.abs(up)), '−2 ft base, wall and splash', 'Loft run unchanged'];
    }
    case 'board': return [inr(RATES.woodwork[o.id].laminate) + ' per sq ft with laminate', round1(p.carcass.total) + ' sq ft carcass'];
    case 'handle': return [inr(RATES.handle[o.id]) + ' per handle', p.handles + ' handles · ' + inr(p.breakdown.HP)];
    case 'counter': return [inr(RATES.counter[o.id]) + ' per sq ft', round1(r.base * COUNTER_DEPTH) + ' sq ft · ' + inr(p.breakdown.CTP)];
    case 'backsplash': return [inr(RATES.backsplash[o.id]) + ' per sq ft', round1(r.grossBase * SPLASH_HEIGHT) + ' sq ft · ' + inr(p.breakdown.BSP)];
    case 'sinkMaterial': return ['looks only', 'the price is set by the bowl type'];
    case 'sinkType': return [inr(RATES.sinkType[o.id]) + ' per set', 'any material'];
    case 'faucet': return [inr(RATES.faucet[o.id]) + ' each', FAUCET_COUNT + ' faucet in this quote'];
    case 'hingeBrand': return [inr(RATES.hingeFn[fn.id]) + ' per hinge', p.hinges + ' hinges · ' + inr(p.breakdown.HiP)];
    case 'hingeFunction': return [inr(RATES.hingeFn[o.id]) + ' per hinge', p.hinges + ' hinges · ' + inr(p.breakdown.HiP)];
    case 'lighting': return [inr(RATES.lighting[o.id]) + ' per project', 'priced once for the kitchen'];
    case 'drawers': {
      const q = Number(state.drawers[o.id]) || 0;
      const r = RATES.drawers[o.id];
      return [inr(r) + ' each', (q || 0) + ' in this quote · ' + inr(q * r)];
    }
  }
  return [];
}

function complete(i = state.step){
  const s = STEPS[i];
  if(s.id === 'size') return sizeOk();
  if(s.id === 'surfaces' || s.id === 'basin' || s.id === 'hinge') return true;
  if(s.id === 'build') return !!(state.board && state.finish);
  if(s.id === 'details' || s.id === 'quote') return !!state.lead;
  if(s.multi === 'units') return ['base','wall','loft','tall'].some(k => state.units[k]);
  if(s.multi === 'acc') return true;
  const sg = SKIP_GROUP[s.id];
  if(sg && state.skip[sg]) return true;
  if(s.key) return !!state[s.key];
  return true;
}
function isOn(step, id){
  if(step.multi === 'units') return !!state.units[id];
  if(step.multi === 'dwr') return (Number(state.drawers[id]) || 0) > 0;

  if(st.id === 'size') return hasSize() ? state.l + ' × ' + state.b + ' × ' + state.h + ' ft' : '';
  if(st.id === 'build'){
    if(!state.board || !state.finish) return '';
    const spec = buildSpec();
    return spec.board.name + ' · ' + spec.finish.name + (state.glass && state.units.wall ? ' + glass' : '');
  }
  if(st.id === 'hinge'){
    const b = byId(HINGE_BRANDS, state.hingeBrand), f = byId(HINGE_FUNCTIONS, state.hingeFunction);
    return [(b ? b.name : 'Brand'), (f ? f.name : 'Function')].join(' · ');
  }
  if(st.id === 'basin'){
    if(state.skip.sink) return 'Sink skipped';
    const m = byId(SINK_MATERIALS, state.sinkMaterial), t = byId(SINK_TYPES, state.sinkType);
    return [m ? m.name : 'Material', t ? t.name : 'Type'].join(' · ');
  }
  if(st.id === 'surfaces'){
    const c = byId(COUNTERS, state.counter), b = byId(BACKSPLASH, state.backsplash);
    return [state.skip.counter ? 'No worktop' : (c ? c.name : 'Worktop'),
            state.skip.backsplash ? 'No splash' : (b ? b.name : 'Backsplash')].join(' · ');
  }
  if(st.id === 'details') return state.lead ? state.name : '';
  if(st.id === 'quote') return '';
  const sg = SKIP_GROUP[st.id];
  if(sg && state.skip[sg]) return 'Skipped';
  if(st.multi === 'units'){
    const names = UNITS.filter(u => state.units[u.id]).map(u => u.name);
    return names.length ? names.join(' + ') : '';
  }
  if(st.multi === 'acc'){
    const n = DRAWERS.reduce((t, a) => t + (Number(state.drawers[a.id]) || 0), 0);
    return n ? n + ' items' : '';
  }
  if(st.key){
    const o = byId(st.opts, state[st.key]);
    return o ? o.name : '';
  }
  return '';
}
function updateBar(){
  const i = state.step, p = price();
  $('back').disabled = i <= 1;
  $('total').textContent = inr(p.total);
  $('estLbl').textContent = p.assumed ? 'Estimated price · assumed room' : 'Estimated price';
  $('dock').classList.toggle('gone', i >= DETAILS);
  $('dockStep').textContent = STEPS[i].eyebrow || '';
  const total = LAST;
  const no = $('stepNo');
  if(no) no.textContent = (i >= 1 && i < DETAILS) ? 'Step ' + i + ' of ' + total : '';
  const go = $('dockGo');
  if(go){
    const can = complete(i);
    go.disabled = !can;
    go.textContent = can ? 'Continue' : (SKIP_GROUP[STEPS[i].id] ? 'Skip' : 'Continue');
  }
  $('dots').innerHTML = STEPS.slice(1).map((_, k) => {
    const n = k + 1;
    return `<i class="${n < i ? 'done' : n === i ? 'cur' : ''}"></i>`;
  }).join('');
  $('dockMenu').innerHTML = STEPS.slice(1).map((st, k) => {
    const n = k + 1;
    return `<button type="button" data-jump="${n}" class="${n === i ? 'cur' : complete(n) && n < i ? 'done' : ''}">
      <span class="n">${String(n).padStart(2, '0')}</span><span>${esc(st.eyebrow)}</span><em>${esc(chosen(st))}</em></button>`;
  }).join('');
}

stage.addEventListener('click', e => {
  const zoom = e.target.closest('.zoom');
  if(zoom){ e.preventDefault(); openPhoto(zoom.dataset.img, zoom.dataset.name); return; }
  const opt = e.target.closest('[data-pick]');
  if(opt){
    if(busy) return;
    const step = STEPS[state.step], id = opt.dataset.pick;
    const kind = opt.dataset.kind;
    if(kind === 'board'){
      state.board = id; save();
      stage.querySelectorAll('.segbtn').forEach(b => {
        const on = b.dataset.pick === id;
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
      });
      stage.querySelectorAll('.fcard').forEach(c => {
        const r = c.querySelector('.frate');
        if(r) r.innerHTML = inr(RATES.woodwork[id][c.dataset.pick]) + '<small>/sq ft</small>';
      });
      updateBar();
      return;
    }
    if(kind === 'finish'){
      state.finish = id; save();
      stage.querySelectorAll('.fcard').forEach(c => {
        const on = c.dataset.pick === id;
        c.classList.toggle('on', on); c.setAttribute('aria-pressed', on);
      });
      const cont = document.querySelector('.head-action .btn');
      if(cont) cont.disabled = !complete(state.step);
      updateBar();
      return;
    }
    if(kind === 'group'){
      const gkey = opt.dataset.gkey;
      const st = STEPS[state.step];
      state[gkey] = id;
      if(st.skipKey) state.skip[st.skipKey] = false; else state.skip[gkey] = false;
      save();
      stage.querySelectorAll(`.ucard[data-gkey="${gkey}"]`).forEach(c => {
        const on = c.dataset.pick === id;
        c.classList.toggle('on', on); c.classList.remove('muted');
        c.setAttribute('aria-pressed', on);
      });
      const chip = stage.querySelector(`.chip[data-group="${gkey}"]`);
      if(chip) chip.textContent = 'Skip';
      if(st.dynamic){ draw(); return; }
      updateBar();
      return;
    }
    if(kind === 'pick'){
      state[step.key] = id; save();
      stage.querySelectorAll('.ucard').forEach(c => {
        const on = c.dataset.pick === id;
        c.classList.toggle('on', on); c.setAttribute('aria-pressed', on);
      });
      updateBar();
      setTimeout(() => go(state.step + 1), 320);
      return;
    }
    if(kind === 'unit'){
      state.units[id] = !state.units[id]; save();
      const card = opt.closest('.fcard');
      if(card) card.classList.toggle('on', state.units[id]);
      opt.setAttribute('aria-pressed', state.units[id]);
      const cont = document.querySelector('.head-action .btn');
      if(cont) cont.disabled = !complete(state.step);
      updateBar();
      return;
    }
    if(step.multi === 'units'){
      state.units[id] = !state.units[id];
      const card = opt.closest('.opt');
      card.classList.toggle('on', state.units[id]);
      opt.setAttribute('aria-pressed', state.units[id]);
      stage.querySelectorAll('.opt').forEach(c => {
        const h = c.querySelector('[data-pick]');
        const unit = byId(UNITS, h.dataset.pick);
        const pr = c.querySelector('.pr');
        if(pr) pr.textContent = optLabel(step, unit);
        const d = c.querySelector('.detail');
        if(d) d.innerHTML = `<b>${esc(unit.name)}</b>` + detailLines(step, unit).map(t => `<span>${esc(t)}</span>`).join('');
      });
      const cont = document.querySelector('.head-action .btn');
      if(cont) cont.disabled = !complete(state.step);
      updateBar(); save();
      return;
    }
    if(step.multi === 'acc'){
      const card = opt.closest('.opt');
      state.drawers[id] = (Number(state.drawers[id]) || 0) > 0 ? 0 : 1;
      card.classList.toggle('on', state.drawers[id] > 0);
      opt.setAttribute('aria-pressed', state.drawers[id] > 0);
      const span = card.querySelector('.qty span');
      if(span) span.textContent = state.drawers[id];
      const det = card.querySelector('.detail span:last-child');
      if(det) det.textContent = state.drawers[id] + ' in this quote · ' + inr(state.drawers[id] * RATES.drawers[id]);
      updateBar();
      const btn = document.querySelector('.head-action .btn');
      if(btn) btn.textContent = DRAWERS.some(a => Number(state.drawers[a.id]) > 0) ? 'Continue →' : 'Skip →';
      save();
      return;
    }
    const sg = SKIP_GROUP[step.id];
    if(sg) state.skip[sg] = false;
    state[step.key] = id; save();
    stage.querySelectorAll('.opt').forEach(o => { o.classList.toggle('on', o === opt.closest('.opt')); o.setAttribute('aria-pressed', o === opt.closest('.opt')); });
    stage.querySelector('.grid').classList.add('picked');
    updateBar();
    setTimeout(() => go(state.step + 1), 320);
    return;
  }
  const qty = e.target.closest('[data-act="qty"]');
  if(qty){
    const id = qty.dataset.id;
    const n = Math.max(0, Math.min(20, (Number(state.drawers[id]) || 0) + Number(qty.dataset.d)));
    state.drawers[id] = n;
    const card = qty.closest('.opt');
    const span = card.querySelector('.qty span');
    if(span) span.textContent = n;
    const det = card.querySelector('.detail span:last-child');
    if(det) det.textContent = n + ' in this quote · ' + inr(n * RATES.drawers[id]);
    card.classList.toggle('on', n > 0);
    const hit = card.querySelector('[data-pick]');
    if(hit) hit.setAttribute('aria-pressed', n > 0);
    updateBar();
    const btn = document.querySelector('.head-action .btn');
    if(btn) btn.textContent = DRAWERS.some(a => Number(state.drawers[a.id]) > 0) ? 'Continue →' : 'Skip →';
    save();
    return;
  }
  const bump = e.target.closest('[data-bump]');
  if(bump){
    const k = bump.dataset.bump, cur = Number(state[k]);
    state[k] = String(cur > 0 ? Math.max(1, cur + Number(bump.dataset.d)) : firstValue(k));
    save(); updateSize(true); updateBar(); return;
  }
  const pre = e.target.closest('[data-preset]');
  if(pre){
    [state.l, state.b] = pre.dataset.preset.split(',');
    if(!(Number(state.h) > 0)) state.h = '9';
    save(); updateSize(true); updateBar(); return;
  }
  const g = e.target.closest('[data-go]');
  if(g && g.disabled) return;
  if(g){ go(Number(g.dataset.go)); return; }
  const act = e.target.closest('[data-act]');
  if(!act) return;
  const a = act.dataset.act;
  if(a === 'skip'){
    const g = act.dataset.group;
    if(g){
      state.skip[g] = true;
      if(g === 'sink') state.skip.faucet = true;
      save(); go(state.step + 1);
    }
  }
  else if(a === 'fb'){
    const id = act.dataset.id;
    if(!Array.isArray(state.fb.tags)) state.fb.tags = [];
    const i = state.fb.tags.indexOf(id);
    if(i >= 0) state.fb.tags.splice(i, 1); else state.fb.tags.push(id);
    const on = i < 0;
    act.classList.toggle('on', on);
    act.setAttribute('aria-pressed', on);
    state.fb.touched = true;
    save();
    queueResend();
  }
  else if(a === 'view') openPhoto(act.dataset.img, act.dataset.name);
  else if(a === 'fb-send') sendQuote(true);
  else if(a === 'fb-skip') sendQuote(false);
  else if(a === 'glass'){
    if(!state.units.wall) return;
    state.glass = !state.glass;
    save();
    act.classList.toggle('on', state.glass);
    act.setAttribute('aria-pressed', state.glass);
    updateBar();
  }
  else if(a === 'gskip'){
    const g = act.dataset.group;
    const on = !!state.skip[g];
    state.skip[g] = !on;
    save();
    act.textContent = !on ? 'Skipped' : 'Skip';
    stage.querySelectorAll(`.ucard[data-gkey="${g}"]`).forEach(c => {
      c.classList.toggle('muted', !on);
      if(!on){ c.classList.remove('on'); c.setAttribute('aria-pressed', 'false'); }
    });
    updateBar();
  }
  else if(a === 'wa') whatsapp();
  else if(a === 'print') window.print();
  else if(a === 'edit') openSheet(act.dataset.k);
  else if(a === 'close-sheet') closeSheet();
  else if(a === 'sheet-pick'){
    const k = act.dataset.k, id = act.dataset.id;
    state[k] = id;
    if(act.dataset.skip) state.skip[act.dataset.skip] = false;
    if(k === 'counter' || k === 'backsplash' || k === 'lighting') state.skip[k === 'counter' ? 'counter' : k === 'backsplash' ? 'backsplash' : 'lighting'] = false;
    save(); refreshSheet();
  }
  else if(a === 'sheet-unit'){ state.units[act.dataset.id] = !state.units[act.dataset.id]; save(); refreshSheet(); }
  else if(a === 'sheet-board'){ state.board = act.dataset.id; save(); refreshSheet(); }
  else if(a === 'sheet-glass'){ state.glass = !state.glass; save(); refreshSheet(); }
  else if(a === 'sheet-qty'){
    const id = act.dataset.id, d = Number(act.dataset.d);
    state.drawers[id] = Math.max(0, Math.min(20, (Number(state.drawers[id]) || 0) + d));
    save(); refreshSheet();
  }
  else if(a === 'dl') downloadQuote(act);
  else if(a === 'reset'){
    if(planUrl) URL.revokeObjectURL(planUrl); planUrl = '';
    transition(() => { state = fresh(); }, -1);
  }
  else if(a === 'back') go(state.step - 1);
  else if(a === 'edit') go(1);
  else if(a === 'pick-plan') $('planInput').click();
  else if(a === 'remove-plan'){
    if(planUrl) URL.revokeObjectURL(planUrl); planUrl = '';
    state.plan = null; state.planError = ''; draw();
  }
  else if(a === 'clear-leads'){
    if(confirm('Clear all saved leads on this device?')){ localStorage.removeItem(LEADS); drawLeads(); }
  }
});

/* One email to the studio. Sent automatically a few minutes after the quote is shown,
   and re-sent with the feedback if the customer answers afterwards. */
const AUTO_SEND_MS = 210000;          // 3.5 minutes
let autoSendTimer = null, resendTimer = null;

function scheduleAutoSend(){
  clearTimeout(autoSendTimer);
  const lead = state.lead;
  if(!lead || lead.delivery !== 'pending' || !CONFIG.leadEndpoint) return;
  const elapsed = Date.now() - new Date(lead.at).getTime();
  autoSendTimer = setTimeout(() => {
    if(state.lead && state.lead.delivery === 'pending') sendQuote(true, { auto:true });
  }, Math.max(4000, AUTO_SEND_MS - elapsed));
}
function queueResend(){
  const lead = state.lead;
  if(!lead || lead.delivery !== 'sent' || !CONFIG.leadEndpoint) return;
  clearTimeout(resendTimer);
  resendTimer = setTimeout(() => {
    if(state.lead && state.lead.delivery === 'sent') sendQuote(true, { resend:true });
  }, 8000);
}
function sendQuote(withFeedback, opts){
  opts = opts || {};
  if(!state.lead) return;
  clearTimeout(autoSendTimer);
  const lead = state.lead, p = price();
  const layout = byId(LAYOUTS, state.layout) || byId(LAYOUTS, 'lshape');
  const units = UNITS.filter(u => state.units[u.id]).map(u => u.name).join(' + ');
  const fb = state.fb || {};
  const reactions = withFeedback ? (fb.tags || []).map(id => (FEEDBACK.find(f => f.id === id) || {}).label).filter(Boolean) : [];
  const budget = withFeedback && fb.touched && fb.budget != null ? fb.budget : null;
  const when = new Date(lead.at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
  const lines = p.lines.map((l, k) => '  ' + String(k + 1).padStart(2, '0') + '. ' + l.d + ' · ' + l.q + (l.u ? ' ' + l.u : '') + ' · ' + inr(l.a)).join('\n');
  const message = [
    'HOMESIC · MODULAR KITCHEN QUOTE',
    'Ref ' + lead.id + '   ' + when,
    '',
    'CUSTOMER',
    '  ' + state.name + ' · ' + state.phone + (state.email ? ' · ' + state.email : '') + (state.city ? ' · ' + state.city : ''),
    '',
    'KITCHEN',
    '  ' + layout.name + ' · ' + state.l + ' × ' + state.b + ' × ' + state.h + ' ft',
    '  Units: ' + units,
    '  Board / finish: ' + p.board.name + ' + ' + p.finish.name,
    '  Worktop: ' + p.counter.name + (state.skip.counter ? ' (skipped)' : '') + ' · Backsplash: ' + p.splash.name + (state.skip.backsplash ? ' (skipped)' : ''),
    '  Sink: ' + p.sinkMat.name + ', ' + p.sinkT.name + (state.skip.sink ? ' (skipped)' : '') + ' · Tap: ' + p.faucet.name + (state.skip.faucet ? ' (skipped)' : ''),
    '  Hinges: ' + p.hBrand.name + ' ' + p.hFn.name + ' · Lighting: ' + p.light.name + (state.skip.lighting ? ' (skipped)' : ''),
    p.glassOn ? '  Glass profile shutters: yes' : null,
    '',
    'PRICE',
    lines,
    '  TOTAL ' + inr(p.total) + ' · all-inclusive, including 5% design',
    '',
    'CUSTOMER FEEDBACK',
    withFeedback
      ? (reactions.length ? '  Reactions: ' + reactions.join(' · ') : '  Reactions: none picked')
      : '  The customer skipped this step',
    withFeedback
      ? (budget != null
          ? '  Budget: ' + inr(budget) + ' (quote ' + inr(p.total) + ')'
          : '  Budget: the customer never touched the budget lever')
      : null,
    opts.resend ? '  (updated — the customer changed their answers after the first email)' : null,
    opts.auto ? '  (sent automatically ' + Math.round(AUTO_SEND_MS / 60000) + ' minutes after the quote; the customer had not pressed send)' : null,
    '',
    'Sent from the Homesic kitchen estimator.'
  ].filter(x => x !== null).join('\n');

  const kind = (reactions.length || budget != null) ? 'Kitchen quote + feedback' : 'Kitchen quote';
  const subject = kind + (opts.resend ? ' (updated)' : '') + ' · ' + lead.id;
  const payload = {
    access_key: CONFIG.leadAccessKey || undefined,
    subject,
    from_name: CONFIG.leadCompany || 'Homesic website',
    name: state.name, email: state.email || undefined, phone: state.phone, city: state.city,
    quote_id: lead.id, total: p.total,
    reactions: reactions.join(' | ') || undefined,
    budget: budget != null ? budget : undefined,
    budget_touched: withFeedback ? (fb.touched ? 'yes' : 'no') : undefined,
    delivery_mode: opts.resend ? 'updated feedback' : opts.auto ? 'auto' : 'customer pressed send',
    message
  };

  if(withFeedback) lead.feedbackAt = new Date().toISOString();
  lead.delivery = 'sending'; save();
  if(state.step === LAST) draw();

  const done = ok => {
    if(state.lead && state.lead.id === lead.id){
      state.lead.delivery = ok ? 'sent' : 'failed';
      save();
      if(state.step === LAST) draw();
    }
  };

  if(!CONFIG.leadEndpoint){ done(true); return; }

  if(/web3forms\.com/i.test(CONFIG.leadEndpoint)){
    const wf = $('wfForm');
    wf.action = CONFIG.leadEndpoint;
    wf.innerHTML = '';
    const add = (k, v) => {
      if(v === undefined || v === null || v === '') return;
      const el = document.createElement('input');
      el.type = 'hidden'; el.name = k; el.value = String(v);
      wf.appendChild(el);
    };
    Object.keys(payload).forEach(k => add(k, payload[k]));
    let marked = false;
    const mark = () => { if(marked) return; marked = true; done(true); };
    const frame = $('wfTarget');
    frame.onload = () => setTimeout(mark, 250);
    setTimeout(mark, 2500);
    wf.submit();
  } else {
    fetch(CONFIG.leadEndpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json().catch(() => ({})); })
      .then(j => { if(j && j.success === false) throw new Error('rejected'); done(true); })
      .catch(() => done(false));
  }
}

document.addEventListener('click', e => { if(!dock.contains(e.target)) dock.classList.remove('open'); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') dock.classList.remove('open'); });
$('home').addEventListener('click', e => { e.preventDefault(); go(0); });

  if(e.target.closest('.pv-close') || e.target.id === 'photoView') closePhoto();
});

function whatsapp(){
  const p = price();
  const layout = byId(LAYOUTS, state.layout) || byId(LAYOUTS, 'lshape');
  const text = ['Hi Homesic, I would like a quote for my kitchen.',
    'Ref: ' + (state.lead ? state.lead.id : '—'),
    'Name: ' + state.name + (state.city ? ' · ' + state.city : ''),
    layout.name + ' · ' + state.l + ' × ' + state.b + ' × ' + state.h + ' ft (L × B × H)',
    ...p.lines.map(l => l.d + ': ' + l.q + ' ' + l.u + ' × ' + inr(l.r) + ' = ' + inr(l.a)),
    'Grand total: ' + inr(p.total)].join('\n');
  window.open('https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
}


/* ============================================================
   INLINE EDITOR — change any choice from the quote page
   ============================================================ */
const EDIT_MAP = {
  shape:      { title:'Shape', steps:[{ key:'layout', list:() => LAYOUTS }] },
  storage:    { title:'Storage', units:true },
  build:      { title:'Board and finish', build:true },
  handles:    { title:'Handles', steps:[{ key:'handle', list:() => HANDLES }] },
  worktop:    { title:'Worktop', steps:[{ key:'counter', list:() => COUNTERS, skip:'counter' }] },
  backsplash: { title:'Backsplash', steps:[{ key:'backsplash', list:() => BACKSPLASH, skip:'backsplash' }] },
  sink:       { title:'Sink', steps:[
                  { key:'sinkMaterial', label:'Material', list:() => SINK_MATERIALS, skip:'sink', round:true },
                  { key:'sinkType', label:'Bowl', list:() => SINK_TYPES, skip:'sink' }] },
  tap:        { title:'Tap', steps:[{ key:'faucet', list:() => FAUCETS, skip:'faucet' }] },
  hinges:     { title:'Hinges', steps:[
                  { key:'hingeBrand', label:'Brand', list:() => HINGE_BRANDS },
                  { key:'hingeFunction', label:'Function', list:() => HINGE_FUNCTIONS }] },
  lighting:   { title:'Lighting', steps:[{ key:'lighting', list:() => LIGHTING, skip:'lighting' }] },
  drawers:    { title:'Drawers', drawers:true }
};

function sheetPrice(key, id){
  const p = price();
  switch(key){
    case 'layout': {
      const r = runFor(id);
      return round1(r.base) + ' ft base · ' + round1(r.wall) + ' ft wall';
    }
    case 'handle': return inr(RATES.handle[id]) + ' / door';
    case 'counter': return RATES.counter[id] ? inr(RATES.counter[id]) + ' / sq ft' : 'Included';
    case 'backsplash': return RATES.backsplash[id] ? inr(RATES.backsplash[id]) + ' / sq ft' : 'Included';
    case 'sinkMaterial': return '';
    case 'sinkType': return inr(RATES.sinkType[id]);
    case 'faucet': return inr(RATES.faucet[id]);
    case 'hingeBrand': return inr(RATES.hingeFn[state.hingeFunction || DEFAULTS.hingeFunction]) + ' / hinge';
    case 'hingeFunction': return inr(RATES.hingeFn[id]) + ' / hinge';
    case 'lighting': return inr(RATES.lighting[id]) + ' / project';
    case 'finish': return inr(RATES.woodwork[state.board || DEFAULTS.board][id]) + ' / sq ft';
    default: return '';
  }
}

function sheetOption(key, o){
  const on = state[key] === o.id;
  return `<button type="button" class="sheet-opt${on ? ' on' : ''}" data-act="sheet-pick" data-k="${key}" data-id="${o.id}"${o.skip ? ` data-skip="${o.skip}"` : ''}>
    <span class="so-name">${esc(o.name)}</span>
    <span class="so-price">${esc(sheetPrice(key, o.id))}</span>
    <span class="so-tick" aria-hidden="true">✓</span>
  </button>`;
}

function sheetBody(k){
  const cfg = EDIT_MAP[k];
  if(!cfg) return '';
  if(cfg.units){
    return UNITS.map(u => {
      const on = !!state.units[u.id];
      return `<button type="button" class="sheet-opt${on ? ' on' : ''}" data-act="sheet-unit" data-id="${u.id}">
        <span class="so-name">${esc(u.name)}</span>
        <span class="so-price">${u.id === 'fridge' ? 'closes the gap' : 'carcass ' + (u.id === 'base' ? '×3' : u.id === 'wall' ? '×2' : '×' + (state.h - 7))}</span>
        <span class="so-tick" aria-hidden="true">✓</span></button>`;
    }).join('');
  }
  if(cfg.build){
    const board = byId(BOARDS, state.board) || byId(BOARDS, DEFAULTS.board);
    const seg = BOARDS.map(b => `<button type="button" class="segbtn${state.board === b.id ? ' on' : ''}" data-act="sheet-board" data-id="${b.id}">${esc(b.name)}</button>`).join('');
    const fin = FINISHES.map(f => sheetOption('finish', f)).join('');
    return `<div class="sheet-sub"><span class="ss-label">Board</span><div class="seg" style="flex:1">${seg}</div></div>
      <div class="sheet-sub"><span class="ss-label">Finish</span></div>
      <div class="sheet-grid">${fin}</div>
      <button type="button" class="sheet-opt${state.glass ? ' on' : ''}" data-act="sheet-glass">
        <span class="so-name">Glass shutters</span><span class="so-price">${inr(RATES.glass)} / sq ft · wall units</span>
        <span class="so-tick" aria-hidden="true">✓</span></button>`;
  }
  if(cfg.drawers){
    return DRAWERS.map(d => {
      const q = Number(state.drawers[d.id]) || 0;
      return `<div class="sheet-row${q ? ' on' : ''}">
        <span class="sr-name">${esc(d.name)}<i>${esc(d.ds)}</i></span>
        <span class="sr-price">${inr(RATES.drawers[d.id])}</span>
        <span class="qty"><button type="button" data-act="sheet-qty" data-id="${d.id}" data-d="-1">−</button><b>${q}</b><button type="button" data-act="sheet-qty" data-id="${d.id}" data-d="1">+</button></span>
      </div>`;
    }).join('');
  }
  return cfg.steps.map(st => {
    const head = st.label ? `<div class="sheet-sub"><span class="ss-label">${esc(st.label)}</span></div>` : '';
    const opts = st.list().map(o => sheetOption(st.key, { ...o, skip: st.skip })).join('');
    return head + `<div class="sheet-grid${st.round ? ' round' : ''}">${opts}</div>`;
  }).join('');
}

function openSheet(k){
  const cfg = EDIT_MAP[k];
  if(!cfg) return;
  $('sheetTitle').textContent = cfg.title;
  $('sheetList').innerHTML = sheetBody(k);
  $('sheetTotal').textContent = 'Quote ' + inr(price().total);
  const sh = $('sheet');
  sh.hidden = false;
  sh.dataset.k = k;
  document.body.classList.add('sheet-open');
  requestAnimationFrame(() => sh.classList.add('in'));
}
function closeSheet(){
  const sh = $('sheet');
  if(!sh || sh.hidden) return;
  sh.classList.remove('in');
  document.body.classList.remove('sheet-open');
  setTimeout(() => { sh.hidden = true; }, 180);
}
function refreshSheet(){
  const sh = $('sheet');
  if(!sh || sh.hidden) return;
  draw();
  const k = sh.dataset.k;
  $('sheetList').innerHTML = sheetBody(k);
  $('sheetTotal').textContent = 'Quote ' + inr(price().total);
  openSheet(k);
}


/* sheet clicks live outside #stage, so they get their own listener */
$('sheet').addEventListener('click', e => {
  if(e.target === $('sheet')){ closeSheet(); return; }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const a = el.dataset.act;
  if(a === 'close-sheet'){ closeSheet(); return; }
  if(a === 'sheet-pick'){
    const k = el.dataset.k, id = el.dataset.id;
    state[k] = id;
    if(el.dataset.skip) state.skip[el.dataset.skip] = false;
    if(k === 'counter' || k === 'backsplash' || k === 'lighting') state.skip[k] = false;
    save(); refreshSheet(); return;
  }
  if(a === 'sheet-unit'){ state.units[el.dataset.id] = !state.units[el.dataset.id]; save(); refreshSheet(); return; }
  if(a === 'sheet-board'){ state.board = el.dataset.id; save(); refreshSheet(); return; }
  if(a === 'sheet-glass'){ state.glass = !state.glass; save(); refreshSheet(); return; }
  if(a === 'sheet-qty'){
    const id = el.dataset.id, d = Number(el.dataset.d);
    state.drawers[id] = Math.max(0, Math.min(20, (Number(state.drawers[id]) || 0) + d));
    save(); refreshSheet(); return;
  }
});

if(/[?&]leads=1/.test(location.search)) drawLeads();
else draw();
scheduleAutoSend();
if(/[?&]selftest=lead/.test(location.search)) leadSelfTest();

/* Opens from ?selftest=lead - posts one sample lead through the same path the
   quote uses, then tells you where to look. Remove the query string afterwards. */
function leadSelfTest(){
  const box = document.createElement('pre');
  box.style.cssText = 'position:fixed;inset:16px;z-index:9999;margin:0;padding:20px;background:#141312;color:#F3F0EA;'
    + 'font:12.5px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;border:1px solid #3a3630;border-radius:12px;overflow:auto';
  document.body.appendChild(box);
  const key = String(CONFIG.leadAccessKey || '').trim();
  const lines = [
    'HOMESIC - lead delivery self test',
    '',
    'endpoint : ' + (CONFIG.leadEndpoint || '(none)'),
    'key      : ' + (key ? key.slice(0, 8) + '...' + key.slice(-4) : '(empty)'),
    'whatsapp : ' + (CONFIG.whatsapp || '(not set)'),
    ''
  ];
  if(!key || !CONFIG.leadEndpoint){
    lines.push('RESULT: no key or endpoint set - leads cannot be delivered.');
    box.textContent = lines.join('\n');
    return;
  }
  if(key === 'd411e48a-e577-490c-993e-819d53082e91'){
    lines.push('WARNING: this is the key that shipped with the template.');
    lines.push('Leads are going to that account, not to you. Replace it with your own key.');
    lines.push('');
  }
  lines.push('Posting a sample lead now...');
  box.textContent = lines.join('\n');

  const payload = {
    access_key: key,
    subject: 'Homesic estimator - test lead',
    from_name: CONFIG.leadCompany || 'Homesic website',
    name: 'Test lead', phone: '0000000000', city: 'Test', quote_id: 'TEST-' + Date.now(),
    total: price().total, mode: 'self test',
    message: 'This is a test from the Homesic estimator. If you can read this, leads are working.'
  };
  const formPost = /web3forms\.com/i.test(CONFIG.leadEndpoint);
  if(formPost){
    const wf = $('wfForm');
    wf.action = CONFIG.leadEndpoint;
    wf.innerHTML = '';
    Object.keys(payload).forEach(k => {
      const el = document.createElement('input');
      el.type = 'hidden'; el.name = k; el.value = String(payload[k]);
      wf.appendChild(el);
    });
    wf.submit();
    lines.push('');
    lines.push('Sent as a normal form post (Web3Forms blocks scripted reads, so the');
    lines.push('browser cannot confirm it). Check that inbox in a few seconds:');
    lines.push('   - a "Homesic estimator - test lead" email means you are live.');
    lines.push('   - nothing means the key is wrong or belongs to another account.');
    box.textContent = lines.join('\n');
  } else {
    fetch(CONFIG.leadEndpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    }).then(async r => {
      const body = await r.text();
      lines.push('');
      lines.push('HTTP ' + r.status);
      lines.push(body.slice(0, 400));
      lines.push(r.ok ? 'RESULT: accepted - check the inbox.' : 'RESULT: rejected - check the key and form id.');
      box.textContent = lines.join('\n');
    }).catch(e => {
      lines.push('');
      lines.push('Network error: ' + e.message);
      lines.push('RESULT: could not reach the endpoint.');
      box.textContent = lines.join('\n');
    });
  }
}
